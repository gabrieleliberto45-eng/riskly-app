# la striscia dei mercati e il prossimo dato leggono questi indirizzi dallo stesso dominio (nessuna richiesta del browser a terzi)
[[redirects]]
  from = "/api/calendario"
  to = "https://economic-calendar.tradingview.com/events"
  status = 200
  force = true
  headers = {Origin = "https://www.tradingview.com"}

# pagine prodotto dei software (generate da pagine_software.py)
[[redirects]]
  from = "/software/*"
  to = "/software/:splat.html"
  status = 200

# pagina dei partner selezionati
[[redirects]]
  from = "/partner"
  to = "/partner.html"
  status = 200

# qualsiasi altro indirizzo (es. link delle email di conferma) apre il sito invece di "Page not found"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
