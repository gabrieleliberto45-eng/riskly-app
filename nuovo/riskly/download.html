<script>
  const SB_URL = 'https://swlztverwfgdgchgpudt.supabase.co';
  const SB_KEY = 'sb_publishable_j9bujIvCEz6x21yYoCODPw_lIZCJrIR';

  let sb = null;
  try{ if(window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); }
  catch(e){ console.error(e); }

  /* ---------- conteggio visite (anonimo, senza cookie) ---------- */
  (function(){
    try{
      if(!sb) return;
      if(sessionStorage.getItem('riskly_visita')) return;
      sessionStorage.setItem('riskly_visita','1');
      let da = '';
      try{ da = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./,'') : ''; }catch(e){}
      const q = new URLSearchParams(location.search);
      const tag = q.get('da') || q.get('utm_source') || '';
      if(!(window.rNonContare && rNonContare())) sb.from('visite').insert({ percorso: location.pathname || '/', referer: tag || da || 'diretto' })
        .then(()=>{}, ()=>{});
    }catch(e){}
  })();

  function mostraGate(testo, azioni){
    document.getElementById('gate-testo').innerHTML = testo;
    document.getElementById('gate-azioni').innerHTML = azioni || '';
    document.getElementById('gate').style.display = 'block';
    document.getElementById('lista').style.display = 'none';
  }

  /* il link del gruppo arriva dal server, e solo a chi ha un acquisto attivo:
     nel codice della pagina non c'è, quindi non si trova con "visualizza sorgente" */
  async function linkDa(funzione){
    try{
      const { data, error } = await sb.rpc(funzione);
      if(!error && typeof data === 'string' && data.startsWith('https://t.me/')) return data;
    }catch(e){}
    return '';
  }
  function pulsante(box, link, testo){
    if(link){
      const a = document.createElement('a');
      a.className = 'btn-link'; a.href = link; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = testo;
      box.replaceChildren(a);
    }else{
      box.innerHTML = '<div class="sub" style="margin:0;color:var(--text)">Il link è in arrivo: ti scriviamo noi all\'email dell\'acquisto.</div>';
    }
  }
  /* un acquisto = una scheda, con le istruzioni di quel prodotto */
  const NOMI = { 'Videocorso':'Corso · Gestione del rischio', 'Corso Analisi fondamentale':'Corso · Analisi fondamentale', 'Pacchetto corsi':'Pacchetto · i due corsi' };
  function tipo(p){
    if(/pacchetto/i.test(p)) return 'pacchetto';
    if(/^videocorso/i.test(p)) return 'rischio';
    if(/fondamentale/i.test(p)) return 'fondamentale';
    if(/^journal/i.test(p)) return 'journal';
    return 'bot';
  }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]); }
  function bottone(link, testo){
    return link ? `<a class="btn-link" href="${esc(link)}" target="_blank" rel="noopener">${testo}</a>`
                : `<div class="acq-nota">Il link è in arrivo: ti scriviamo noi all'email dell'acquisto.</div>`;
  }
  function passi(t, L, prodotto){
    const corso = (link, nome) => `<li><b>Entra nel gruppo Telegram del corso ${nome}.</b> Tocca il pulsante e chiedi di entrare: approviamo le richieste a mano, di solito in poche ore. Dentro trovi una cartella per ogni modulo con le lezioni in ordine.${bottone(link, 'Entra nel corso')}</li>`;
    if(t === 'rischio') return corso(L.corso, 'di gestione del rischio') + `<li><b>Scarica dispense e kit Excel</b> che trovi nel gruppo, e segui i moduli in ordine.</li><li><b>Fai i quiz di fine modulo:</b> 5 domande per modulo, alla fine scarichi l'attestato.<a class="btn-link" href="/quiz-rischio">Apri il quiz</a></li><li>L'accesso è <b>a vita</b>, aggiornamenti compresi.</li>`;
    if(t === 'fondamentale') return corso(L.fond, 'di analisi fondamentale') + `<li><b>Scarica le dispense</b> nel gruppo e segui i moduli in ordine.</li><li><b>Fai i quiz di fine modulo:</b> 5 domande per modulo, alla fine scarichi l'attestato.<a class="btn-link" href="/quiz-fondamentale">Apri il quiz</a></li><li>L'accesso è <b>a vita</b>, aggiornamenti compresi.</li>`;
    if(t === 'pacchetto') return corso(L.corso, 'di gestione del rischio') + corso(L.fond, 'di analisi fondamentale') + `<li><b>Fai i quiz di fine modulo</b> di ogni corso: ricevi i due attestati.<a class="btn-link" href="/quiz-rischio">Quiz · Gestione del rischio</a><a class="btn-link" href="/quiz-fondamentale">Quiz · Analisi fondamentale</a></li><li>L'accesso è <b>a vita</b> a tutti e due, aggiornamenti compresi.</li>`;
    if(t === 'journal') return `<li><b>Il piano ${esc(prodotto.replace(/^journal\s+/i, ''))} è attivo</b> sul tuo account.</li><li><b>Apri il journal</b> con la stessa email e lo trovi già sbloccato.<a class="btn-link" href="https://app.riskly.trade">Apri il journal</a></li>`;
    const cod = codice(prodotto), max = maxConti(cod);
    return `<li><b>Entra nel gruppo clienti su Telegram.</b> È riservato a chi ha acquistato: lì trovi il file di ${esc(prodotto)}, la guida passo passo e gli aggiornamenti. Approviamo le richieste a mano, di solito in poche ore.${bottone(L.clienti, 'Entra nel gruppo clienti')}</li>
      <li><b>Abilita i tuoi conti MetaTrader.</b> Scrivi qui il numero del conto su cui userai ${esc(prodotto)}: puoi abilitarne fino a ${max}${cod === 'risklycopy' ? ' (il conto principale e 2 copie)' : ''}. Il bot si attiva da solo su quei conti.
        <div class="conti" data-prod="${esc(cod)}" data-max="${max}"><div class="conti-lista">Carico i tuoi conti…</div>
          <form class="conti-form" onsubmit="aggiungiConto(event, '${esc(cod)}')"><input type="text" inputmode="numeric" pattern="[0-9]{3,11}" placeholder="Numero del conto, es. 51234567" required><button type="submit">Abilita</button></form>
          <div class="conti-msg" role="status"></div></div></li>
      <li><b>Installa seguendo la guida</b> del gruppo: si copia il file nella cartella degli Expert di MetaTrader e si trascina sul grafico.</li>
      <li><b>Prova prima su un conto demo</b> (abilita anche quello), poi passa al conto reale. Gli aggiornamenti arrivano nel gruppo, gratis.</li>`;
  }
  /* licenze: "Riskly Pro" -> "risklypro", come licenza_codice() nel database */
  const codice = n => String(n || '').replace(/[^A-Za-z]/g, '').toLowerCase();
  const maxConti = c => (c === 'risklypro' || c === 'risklycopy') ? 3 : 2;
  async function caricaConti(){
    const box = document.querySelectorAll('.conti'); if(!box.length || !sb) return;
    let righe = [];
    try{ const { data, error } = await sb.rpc('licenza_miei_conti'); if(!error && data) righe = data; }catch(e){}
    box.forEach(b => {
      const miei = righe.filter(r => r.prodotto === b.dataset.prod), max = +b.dataset.max;
      b.querySelector('.conti-lista').innerHTML = miei.length
        ? miei.map(r => `<span class="conto">✓ ${esc(r.conto)}</span>`).join('') + `<small>${miei.length} di ${max} abilitati</small>`
        : `<small>Nessun conto abilitato ancora.</small>`;
      b.querySelector('.conti-form').style.display = miei.length >= max ? 'none' : '';
      if(miei.length >= max) b.querySelector('.conti-msg').textContent = 'Hai abilitato tutti i conti: per cambiarne uno scrivi a supporto@riskly.trade.';
    });
  }
  window.aggiungiConto = async function(ev, prod){
    ev.preventDefault();
    const f = ev.target, inp = f.querySelector('input'), msg = f.parentElement.querySelector('.conti-msg'), n = inp.value.replace(/\D/g, '');
    if(!n){ msg.textContent = 'Scrivi il numero del conto, solo cifre.'; return; }
    f.querySelector('button').disabled = true; msg.textContent = 'Abilito il conto…';
    try{
      const { data, error } = await sb.rpc('licenza_aggiungi_conto', { p_prodotto: prod, p_conto: Number(n) });
      if(error) throw error;
      msg.textContent = data === 'OK' ? 'Conto ' + n + ' abilitato: il bot si attiva da solo entro qualche minuto.' : data;
      if(data === 'OK') inp.value = '';
    }catch(e){ msg.textContent = 'Non sono riuscito ad abilitare il conto. Riprova o scrivi a supporto@riskly.trade.'; }
    f.querySelector('button').disabled = false;
    caricaConti();
  };

  async function sblocca(righe){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('lista').style.display = 'block';
    /* un prodotto una volta sola: vale l'acquisto più recente */
    const visti = new Set(), lista = [];
    for(const r of righe){ if(!visti.has(r.prodotto)){ visti.add(r.prodotto); lista.push(r); } }
    const attivi = lista.filter(r => r.stato === 'attivo').map(r => r.prodotto);
    const servono = new Set(attivi.map(tipo));
    const L = {
      clienti: servono.has('bot') ? await linkDa('link_gruppo_clienti') : '',
      corso: (servono.has('rischio') || servono.has('pacchetto')) ? await linkDa('link_gruppo_corso') : '',
      fond: (servono.has('fondamentale') || servono.has('pacchetto')) ? await linkDa('link_gruppo_fondamentale') : '',
    };
    document.getElementById('acquisti').innerHTML = lista.map((r, i) => {
      const ok = r.stato === 'attivo', t = tipo(r.prodotto || '');
      const data = r.creato ? new Date(r.creato).toLocaleDateString('it-IT', { day:'numeric', month:'long', year:'numeric' }) : '';
      return `<details class="acq${ok ? ' attivo' : ''}"${PAGATO && i === 0 ? ' open' : ''}>
        <summary class="acq-testa"><div><h3>${esc(NOMI[r.prodotto] || r.prodotto)}</h3>
          <div class="acq-meta">${esc(data)}${r.prezzo ? ' · ' + esc(r.prezzo) + '\u00a0€' : ''}</div></div>
          <span class="acq-dx"><span class="stato ${ok ? 'ok' : 'attesa'}">${ok ? 'Attivo' : 'In attesa'}</span><span class="freccia" aria-hidden="true"></span></span></summary>
        ${ok ? `<ol class="passi">${passi(t, L, r.prodotto || '')}</ol>`
             : `<div class="acq-nota">Stiamo aspettando la conferma del pagamento da Stripe: di solito arriva in pochi secondi. Se non hai completato il pagamento, puoi ignorare questo ordine.</div>`}
      </details>`;
    }).join('');

    caricaConti();
    const haBot = attivi.some(p => tipo(p) === 'bot'), haCorso = attivi.some(p => /rischio|pacchetto/.test(tipo(p)));
    const journal = attivi.find(p => /^journal/i.test(p));
    const imposta = (chiave, attivo, testo, codice) => {
      const st = document.getElementById(chiave + '-stato');
      st.textContent = attivo ? 'Attivo' : 'Non attivo'; st.className = 'stato ' + (attivo ? 'ok' : 'spento');
      document.getElementById(chiave + '-testo').innerHTML = testo;
      document.getElementById(chiave + '-codice').textContent = attivo ? (codice || '') : '';
      document.getElementById(chiave + '-box').classList.toggle('off', !attivo);
    };
    /* 50% sul corso di rischio: per chi ha un software e non ha già il corso */
    let cod1 = '';
    if(haBot && !haCorso){ try{ const { data } = await sb.rpc('codice_sconto_corso'); cod1 = data || ''; }catch(e){} }
    if(haCorso) imposta('sconto', false, 'Hai già il corso di gestione del rischio, quindi questo sconto non ti serve.');
    else if(haBot && cod1) imposta('sconto', true, 'Hai un software Riskly: con questo codice il corso di gestione del rischio costa la metà. Inseriscilo nella pagina di pagamento, alla voce "Aggiungi codice promozionale".', cod1);
    else imposta('sconto', false, 'Si attiva quando acquisti uno dei bot Riskly: da quel momento il corso di gestione del rischio costa la metà.');
    /* 30% sui bot: per chi ha il journal Premium */
    let cod2 = '';
    if(journal && /premium/i.test(journal)){ try{ const { data } = await sb.rpc('codice_sconto_premium'); cod2 = data || ''; }catch(e){} }
    if(cod2) imposta('premium', true, 'Hai il journal Premium: con questo codice RiskGuard, TradeManager, ScaleIn e Riskly Pro costano il 30% in meno. Inseriscilo nella pagina di pagamento, alla voce "Aggiungi codice promozionale". Vale finché il piano Premium è attivo.', cod2);
    else imposta('premium', false, 'Si attiva con il piano Premium del journal: finché è attivo, tutti i bot costano il 30% in meno.');
    document.getElementById('vantaggi').style.display = 'block';
  }

  /* arrivo da Stripe dopo il pagamento (i link di pagamento aggiungono ?pagato=1) */
  const PAGATO = new URLSearchParams(location.search).has('pagato');
  const RICEVUTO = '<b style="color:var(--up)">Pagamento ricevuto, grazie!</b><br>';

  async function verifica(){
    if(PAGATO) document.querySelector('#gate h1').textContent = 'Grazie per l\'acquisto';
    if(!sb){
      mostraGate('Connessione al server non riuscita. Ricarica la pagina.', '');
      return;
    }

    const { data:{ session } } = await sb.auth.getSession();
    if(session && window.rSegnaGestore) rSegnaGestore(session.user.email);   /* le visite di Gabriele non si contano */

    if(!session){
      mostraGate(
        PAGATO
          ? RICEVUTO + 'Per seguire il tuo ordine accedi con l\'account Riskly che hai usato per acquistare: '
            + 'quando lo confermiamo, qui compare il pulsante per entrare nel gruppo Telegram.'
          : 'Per entrare nell\'area clienti accedi con l\'account usato per l\'acquisto.',
        '<a class="btn-link" href="index.html">Vai al sito e accedi</a>');
      return;
    }

    /* dopo il pagamento la conferma arriva da Stripe in pochi secondi: se non c'è ancora, riprova */
    let data, error;
    for(let i = 0; i < (PAGATO ? 10 : 1); i++){
      if(i){ mostraGate(RICEVUTO + 'Sto attivando il tuo acquisto, un attimo…', ''); await new Promise(r => setTimeout(r, 3000)); }
      ({ data, error } = await sb.from('acquisti')
        .select('prodotto,stato,prezzo,creato').eq('utente', session.user.id).in('stato', ['attivo', 'in_attesa'])
        .order('creato', { ascending: false }));
      /* gli ordini lasciati a metà (in attesa da più di un giorno) non li mostriamo */
      if(data) data = data.filter(r => r.stato === 'attivo' || (Date.now() - new Date(r.creato).getTime()) < 86400000);
      if(error || (data && data.some(r => r.stato === 'attivo'))) break;
    }

    if(error){
      mostraGate('Non riesco a verificare i tuoi acquisti. Riprova tra poco.', '');
      return;
    }

    if(!data || !data.some(r => r.stato === 'attivo')){
      mostraGate(
        PAGATO
          ? RICEVUTO + 'Stiamo confermando il tuo ordine: di solito in poche ore, al massimo entro 24 ore lavorative. '
            + 'Appena è confermato, in questa pagina compare il pulsante per entrare nel gruppo Telegram. '
            + 'Ricevi la ricevuta di Stripe via email.'
          : 'Il tuo account non ha ancora acquisti confermati.<br>' +
            'Se hai appena pagato, l\'accesso si sblocca appena registriamo il pagamento.',
        '<a class="btn-link" href="index.html">Torna al sito</a>');
      return;
    }

    sblocca(data);
  }

  verifica();
</script>
