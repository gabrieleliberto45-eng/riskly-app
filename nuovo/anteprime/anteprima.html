<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<!-- Anteprime di condivisione (1200×630) di riskly.trade e strumenti.riskly.trade. uso: node rendi.js -->
<style>
@font-face{font-family:'Archivo';src:url(../riskly/fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:'Instrument Sans';font-weight:600;src:url(../riskly/fonts/InstrumentSans-600-normal-latin.woff2)}
@font-face{font-family:'Instrument Sans';font-weight:700;src:url(../riskly/fonts/InstrumentSans-700-normal-latin.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(../riskly/fonts/JetBrainsMono-600-normal-latin.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden}
.c{position:relative;width:1200px;height:630px;padding:64px 72px;color:#15181B;font-family:'Instrument Sans',sans-serif;
  background:radial-gradient(520px 420px at 92% 0%,rgba(233,161,15,.30),transparent 70%),#F3F4F1}
.marca{display:flex;align-items:center;gap:16px;font-weight:700;font-size:38px;letter-spacing:-.02em}
.marca svg{width:68px;height:68px;filter:drop-shadow(0 2px 6px rgba(21,24,27,.12))}
h1{font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.03em;margin-top:56px}
mark{background:linear-gradient(transparent 12%,#E9A10F 12%,#E9A10F 92%,transparent 92%);color:#15181B;padding:0 .08em}
.sotto{position:absolute;left:72px;bottom:58px;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:24px;letter-spacing:.06em;color:#5E656D}
.sotto b{color:#B97C00}
</style></head><body>
<div class="c" id="c">
  <div class="marca"><svg viewBox="0 0 44 44"><rect width="44" height="44" rx="10" fill="#FBFBF9"/><path d="M10 30 L17 20 L23 25 L34 12" stroke="#B97C00" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M10 34.5 H34" stroke="#5E656D" stroke-width="3.6" stroke-linecap="round"/></svg><span id="nome">Riskly</span></div>
  <h1 id="t"></h1>
  <div class="sotto" id="s"></div>
</div>
<script>
window.mostra = d => { document.getElementById('nome').textContent = d.nome; document.getElementById('t').innerHTML = d.titolo; document.getElementById('s').innerHTML = d.sotto; };
</script></body></html>
