@font-face{font-family:'Martian Mono';src:url(/fonts/martian-mono.woff2) format('woff2');font-weight:100 800;font-stretch:75% 112.5%;font-display:swap}

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.testa .indietro2{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:var(--ink);color:var(--panel);display:none;place-items:center;cursor:pointer;font-size:20px}

/* barra in basso */

.barra-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}

/* menu Altro */

.foglio.on{display:block}
.foglio-in{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 0 calc(90px + env(safe-area-inset-bottom))}

.voce{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);font-size:17px;text-decoration:none;color:var(--ink);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-family:'Archivo';cursor:pointer}

.voce small{margin-left:auto;color:var(--ink3);font-size:13px}
.legale{padding:16px 22px;font-size:12px;color:var(--ink3);line-height:1.6}
/* accesso */
.velo{position:fixed;inset:0;z-index:60;background:rgba(21,24,27,.55);display:none;align-items:center;justify-content:center;padding:18px}
.velo.on{display:flex}
.modale{background:var(--panel);border-radius:22px;padding:26px 24px;width:100%;max-width:420px;position:relative}
.modale h3{margin:0 0 6px;font-size:24px;font-family:var(--serif);font-weight:500}

.modale label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.modale input{width:100%;font:16px 'Archivo';padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.modale .x{position:absolute;right:14px;top:12px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink)}
.modale .err{color:var(--rosso);font-size:14px;min-height:20px;margin:10px 0}
.modale .cambia{background:none;border:none;color:var(--oro);font:700 14px 'Archivo';cursor:pointer;margin-top:12px;padding:0}
.flash{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:12px;font-weight:600;z-index:70;display:none;max-width:90vw}
@media(min-width:761px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media(max-width:420px){.riga img,.riga .ph{flex-basis:112px;height:78px}.riga h3{font-size:16.5px}.testata{font-size:27px}}
</style>

<script>
/* ---------- impostazioni ---------- */
const SB_URL = 'https://swlztverwfgdgchgpudt.supabase.co', SB_KEY = 'sb_publishable_j9bujIvCEz6x21yYoCODPw_lIZCJrIR';
/* link di pagamento Stripe di Riskly News (da creare su Stripe e aggiungere anche in supabase/functions/stripe-webhook) */
const PAGA = { mensile: 'https://buy.stripe.com/6oUbJ0eHM1rZ5Bf2jgdnW0m', annuale: '' };
const PREZZO = { mensile: '6,99 € al mese', annuale: '' };   /* prezzo deciso da Gabriele il 1° novembre */
const CAT = { tutti: 'Tutti', dati: 'Dati appena usciti', setup: 'Setup XAU', oro: 'Oro', dollaro: 'Dollaro', fed: 'Fed', tassi: 'Tassi e banche centrali', straordinarie: 'Straordinarie', settimana: 'La settimana' };

let sb = null; try{ sb = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){}
const ACC = { utente: null, accesso: false, modo: 'accedi', dopo: null };
let ANTE = [], filtro = 'tutti';

const esc = x => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dataIt = d => { try{ return new Date(d + 'T12:00:00').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }); }catch(e){ return d; } };
function flash(t){ const f = document.getElementById('flash'); f.textContent = t; f.style.display = 'block'; clearTimeout(flash.t); flash.t = setTimeout(() => f.style.display = 'none', 3200); }
function tema(){
  const s = document.documentElement.getAttribute('data-tema') === 'scuro' ? 'chiaro' : 'scuro';
  document.documentElement.setAttribute('data-tema', s); try{ localStorage.setItem('riskly-tema', s); }catch(e){}
}

/* ---------- dati ---------- */
/* gli articoli vecchi restano tutti nel database: la lista li carica a pagine, senza un tetto */
const PAGINA = 60; let FINITI = false, LETTI = 0;
async function caricaAnteprime(){
  const { data, error } = await sb.from('notizie_anteprima').select('*').order('data', { ascending: false }).order('id', { ascending: false }).range(LETTI, LETTI + PAGINA - 1);
  LETTI += (data || []).length;
  if(error) throw error;
  const nuovi = (data || []).filter(a => !ANTE.some(x => x.id === a.id));
  ANTE = ANTE.concat(nuovi).sort((x, y) => x.data < y.data ? 1 : x.data > y.data ? -1 : (x.id < y.id ? 1 : -1));
  FINITI = (data || []).length < PAGINA;
}
async function altri(b){
  b.disabled = true; b.textContent = 'Carico…';
  try{ await caricaAnteprime(); }catch(e){ flash('Non è andata, riprova.'); }
  vistaLista();
}
async function controllaAccesso(){
  ACC.accesso = false;
  if(!ACC.utente) return;
  const { data } = await sb.rpc('ha_news');
  ACC.accesso = data === true;
}


/* ---------- notifiche: avviso appena esce un articolo (Gabriele, 1° novembre 2026) ----------
   Le manda il server (funzione news-avvisi, chiamata dal database quando entra un articolo),
   anche a sito chiuso. Nella notifica ci sono solo titolo e sommario, che sono gratis per tutti. */
const NEWS_VAPID = 'BBOpQfTYpzmSXLrZtGfnu-x-tx4asq_lVhF0Kzb3ahftFAJ2Js6W-2qt7gTiMk7J8nuSahigHEW17B85bn7UWWw';
const NEWS_ISCRIVI = 'https://swlztverwfgdgchgpudt.supabase.co/functions/v1/news-iscrivi';
let AVVISI = false;
try{ AVVISI = localStorage.getItem('riskly-news-avvisi') === '1'; }catch(e){}
const b64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); const b = atob(s + '='.repeat((4 - s.length % 4) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
function avvisiStato(){
  const ios = /iPhone|iPad/.test(navigator.userAgent), app = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(!('Notification' in window) || !navigator.serviceWorker || !('PushManager' in window)) return ios && !app ? 'ios' : 'no';
  if(Notification.permission === 'denied') return 'negato';
  return AVVISI && Notification.permission === 'granted' ? 'on' : 'off';
}
function campana(){
  const st = avvisiStato();
  // notifiche già accese: niente riquadro (Gabriele, 2 novembre); per spegnerle resta il link in fondo alla pagina
  const sp = document.getElementById('spegni'); if(sp) sp.hidden = st !== 'on';
  if(st === 'on') return '';
  if(st === 'negato') return `<div class="campana"><p>🔕 Hai bloccato le notifiche per questo sito: riattivale dalle impostazioni del browser (lucchetto accanto all'indirizzo).</p></div>`;
  if(st === 'ios') return `<div class="campana"><p>🔔 <b>Vuoi un avviso a ogni articolo?</b> Su iPhone tocca Condividi → <b>Aggiungi alla schermata Home</b>, apri Riskly News da lì e attiva le notifiche.</p></div>`;
  if(st === 'no') return '';

async function avvisiAccendi(b){
  if(b){ b.disabled = true; b.textContent = 'Un attimo…'; }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ flash(perm === 'denied' ? 'Notifiche bloccate: riattivale dalle impostazioni del browser.' : 'Notifiche non attivate.'); ridisegna(); return; }
    const reg = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(NEWS_VAPID) });
    const r = await fetch(NEWS_ISCRIVI, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sub: sub.toJSON() }) });
    if(!r.ok) throw new Error('iscrizione');
    AVVISI = true; try{ localStorage.setItem('riskly-news-avvisi', '1'); }catch(e){}
    flash('Fatto: ti avvisiamo appena esce un articolo.');
  }catch(e){ flash('Non è andata, riprova tra poco.'); }
  ridisegna();
}
async function avvisiSpegni(){
  try{
    const reg = await navigator.serviceWorker.getRegistration('/'); const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ await fetch(NEWS_ISCRIVI, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) }); await sub.unsubscribe(); }
  }catch(e){}
  AVVISI = false; try{ localStorage.setItem('riskly-news-avvisi', '0'); }catch(e){}
  flash('Notifiche disattivate.'); ridisegna();
}

/* ---------- abbonamento ---------- */
function abbonati(tipo){
  if(!ACC.utente){ accApri('registrati', 'abbonati'); return; }
  if(ACC.accesso){ flash('Sei già abbonato.'); return; }
  const link = PAGA[tipo || 'mensile'] || PAGA.mensile;
  if(!link){ flash('L\'abbonamento apre a breve.'); return; }
  const u = new URL(link);
  u.searchParams.set('client_reference_id', ACC.utente.id);
  if(ACC.utente.email) u.searchParams.set('prefilled_email', ACC.utente.email);
  location.href = u.toString();
}

/* ---------- account (lo stesso di riskly.trade e del journal) ---------- */
function accModo(m){
  ACC.modo = m;
  const reg = m === 'registrati';
  document.getElementById('accTit').textContent = reg ? 'Crea un account' : 'Accedi';
  document.getElementById('accSub').textContent = reg ? 'Gratis. Lo stesso account vale per riskly.trade e per il journal.' : 'Usa lo stesso account di riskly.trade e del journal.';
  document.getElementById('accNomeBox').hidden = !reg;
  document.getElementById('accInvio').textContent = reg ? 'Crea account' : 'Accedi';
  document.getElementById('accCambia').textContent = reg ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati gratis';
  document.getElementById('accPass').autocomplete = reg ? 'new-password' : 'current-password';
  document.getElementById('accErr').textContent = '';
}
function accApri(m, dopo){ ACC.dopo = dopo || null; accModo(m || 'accedi'); document.getElementById('velo').classList.add('on'); setTimeout(() => document.getElementById('accEmail').focus(), 50); }
function accChiudi(){ document.getElementById('velo').classList.remove('on'); }
async function accPulsante(){
  if(!ACC.utente){ accApri('accedi'); return; }
  if(confirm('Vuoi uscire dal tuo account?')){ await sb.auth.signOut(); }
}
async function accInvia(e){
  e.preventDefault();
  const email = document.getElementById('accEmail').value.trim(), pass = document.getElementById('accPass').value, err = document.getElementById('accErr');
  err.textContent = '';
  try{
    if(ACC.modo === 'registrati'){
      const nome = document.getElementById('accNome').value.trim();
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + '/', data: { nome } } });
      if(error) throw error;
      if(!data.session){ err.style.color = 'var(--verde)'; err.textContent = 'Ti abbiamo mandato un\'email: conferma l\'indirizzo e poi accedi.'; return; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
    }
    accChiudi();
    if(ACC.dopo === 'abbonati') setTimeout(() => abbonati(), 600);
  }catch(x){
    const m = (x && x.message) || String(x);
    err.style.color = ''; err.textContent = /Invalid login/i.test(m) ? 'Email o password non corrette.' : /already registered/i.test(m) ? 'Questa email ha già un account: accedi.' : 'Non è andata: ' + m;
  }
}
async function aggiornaUtente(sessione){
  ACC.utente = sessione ? sessione.user : null;
  document.getElementById('accBtn').title = ACC.utente ? 'Esci (' + (ACC.utente.email || '') + ')' : 'Accedi';
  await controllaAccesso();
  vista();
}

/* ---------- avvio ---------- */
(async () => {
  if(!sb){ document.getElementById('vista').innerHTML = '<p class="vuoto">Non riesco a collegarmi. Ricarica la pagina.</p>'; return; }
  try{ await caricaAnteprime(); }catch(e){ document.getElementById('vista').innerHTML = '<p class="vuoto">Gli articoli non sono disponibili adesso. Riprova tra poco.</p>'; return; }
  const { data } = await sb.auth.getSession();
  await aggiornaUtente(data.session);
  /* ritorno dal pagamento: il webhook di Stripe attiva l'abbonamento in pochi secondi */
  if(/[?&]abbonato=1/.test(location.search)){
    history.replaceState(null, '', location.pathname + location.hash);
    flash('Grazie! Sto attivando il tuo abbonamento…');
    for(let i = 0; i < 6 && !ACC.accesso; i++){ await new Promise(r => setTimeout(r, 2500)); await controllaAccesso(); }
    vista();
    flash(ACC.accesso ? 'Abbonamento attivo: buona lettura!' : 'Pagamento ricevuto. Se gli articoli restano chiusi, ricarica la pagina tra un minuto.');
  }
  sb.auth.onAuthStateChange((ev, s) => { if(ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') aggiornaUtente(s); });
})();
