<html lang="it">
<head>
<meta charset="utf-8">

<meta name="description" content="Ogni giorno quello che muove oro, dollaro, Fed e tassi: fatti verificati, spiegati in modo semplice, con gli orari italiani. Niente previsioni.">
<meta name="theme-color" content="#F3F4F1">

<style>
/* Riskly News (news.riskly.trade): sotto sito in abbonamento (Gabriele, 1° novembre 2026).
   Titolo e sommario pubblici (vista notizie_anteprima), articolo intero solo per abbonati Riskly News, il Premium del journal non è incluso (tabella notizie, RLS in supabase/news.sql).
   3 novembre 2026: struttura "da app" (Gabriele: "una cosa del genere vorrei per Riskly News"): quotazioni in alto, articolo in evidenza,
   lista con miniature, pagina articolo con immagine grande, barra in basso e menu Altro. */
@font-face{font-family:'Archivo';src:url(/fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:'Martian Mono';src:url(/fonts/martian-mono.woff2) format('woff2');font-weight:100 800;font-stretch:75% 112.5%;font-display:swap}
:root{--bg:#F2F2EF;--panel:#FFFFFF;--ink:#15181B;--ink2:#4B525A;--ink3:#8A8F94;--line:#E2E3E0;--amber:#F2B83A;--oro:#B88A1E;--blu:#1D4FC4;--verde:#0F8A4F;--rosso:#C62F3B;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
html[data-tema="scuro"]{--bg:#0E1110;--panel:#171B19;--ink:#ECEEEA;--ink2:#C3CAC5;--ink3:#98A09A;--line:#2A312D;--oro:#F2B83A;--blu:#7FA5FF;--verde:#4FD08F;--rosso:#FF7A85}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* testata */
.testa{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.testa-in{height:62px;display:flex;align-items:center;justify-content:center;position:relative}
.testata{font-family:var(--serif);font-size:30px;font-variant:small-caps;letter-spacing:.04em;text-decoration:none;color:var(--ink);font-weight:500}
.testata b{color:var(--oro);font-weight:500}
.testa .acc{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.testa .indietro2{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:var(--ink);color:var(--panel);display:none;place-items:center;cursor:pointer;font-size:20px}
body.in-articolo .testa .indietro2{display:grid}
/* quotazioni */
.nastro{overflow:hidden;padding:12px 0;background:var(--panel);border-bottom:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
/* 3 novembre: le quotazioni scorrono da sole (Gabriele); si fermano col dito o col mouse sopra */
.nastro .scorre{display:flex;gap:28px;width:max-content;padding-left:16px;animation:nastro var(--durata,40s) linear infinite}
.nastro:hover .scorre,.nastro:active .scorre{animation-play-state:paused}
@keyframes nastro{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.nastro{overflow-x:auto}.nastro .scorre{animation:none}}
.nastro::-webkit-scrollbar{display:none}
.q{flex:0 0 auto;font-variant-numeric:tabular-nums}
.q .n{font:700 11px 'Martian Mono';letter-spacing:.04em;color:var(--ink3)}
.q .p{font:700 15px 'Archivo';margin-top:2px}
.q .v{font:600 12px 'Archivo';margin-top:1px}
.q .v.su{color:var(--verde)}.q .v.giu{color:var(--rosso)}
/* prossimo dato */
.oggi{margin:14px 16px 0;background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;border:1px solid var(--line)}
.oggi .ora{font:800 18px 'Martian Mono';color:var(--oro);min-width:60px}
.oggi .t{font-size:14px;line-height:1.35;color:var(--ink2)}.oggi .t b{color:var(--ink)}
/* articolo in evidenza */
.evid{display:block;margin:14px 16px 0;background:var(--panel);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid var(--line)}
.evid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0B0D0C}
.evid .txt{padding:14px 16px 16px}
.evid h2{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.2;margin:6px 0 6px}
.evid p{margin:0;color:var(--ink2);font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.data{font-size:13px;color:var(--oro);font-weight:600}
/* lista */
.lista{margin:14px 16px 0;background:var(--panel);border-radius:18px;border:1px solid var(--line);padding:4px 14px}
.riga{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.riga:last-child{border-bottom:none}
.riga img,.riga .ph{flex:0 0 128px;height:86px;border-radius:10px;object-fit:cover;background:#0B0D0C}
.riga .txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.riga h3{font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.22;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 10.5px 'Martian Mono';letter-spacing:.06em;text-transform:uppercase;color:var(--oro)}
.chip .lk{width:16px;height:16px;border-radius:50%;background:var(--amber);display:inline-grid;place-items:center}
.chip.fed,.chip.tassi{color:var(--blu)}.chip.dollaro{color:var(--verde)}.chip.straordinarie,.chip.dati{color:var(--rosso)}
.sez{margin:22px 16px 0;font:700 12px 'Martian Mono';letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
/* riquadri */
.abbonati{margin:14px 16px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1.5px solid var(--amber);border-radius:16px;background:color-mix(in srgb,var(--amber) 10%,var(--panel))}
.abbonati p{margin:0;flex:1 1 220px;font-size:14px;line-height:1.45;color:var(--ink2)}.abbonati p b{color:var(--ink)}
.campana{margin:12px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);font-size:14px;line-height:1.45;color:var(--ink2)}
.campana p{margin:0;flex:1 1 220px}.campana p b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:none;color:var(--ink);font:700 15px 'Archivo';padding:10px 16px;border-radius:12px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--ink);color:var(--panel)}.btn.amb{background:var(--amber);border-color:var(--amber);color:#2B1E00}.btn.wide{width:100%}
.campana .btn{padding:8px 13px;font-size:14px}
.altri{text-align:center;margin:18px 0 8px}
.vuoto{color:var(--ink2);padding:24px 16px}
/* pagina articolo */
.pezzo{background:var(--panel);min-height:80vh;padding-bottom:30px}
.pezzo .cop{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#0B0D0C}
.pezzo .corpo{padding:18px 20px 0}
.bollino{display:table;margin:-14px auto 12px;position:relative;background:var(--amber);color:#2B1E00;font:700 12px 'Archivo';padding:6px 14px;border-radius:999px}
.bollino.cat{background:var(--ink);color:var(--panel)}
.pezzo h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,6vw,36px);line-height:1.18;text-align:center;margin:4px 0 10px}
.firma{text-align:center;color:var(--oro);font-size:14px;line-height:1.5}
.sep{width:120px;height:1px;background:var(--line);margin:18px auto 20px}
.pezzo .somm{font-size:18px;font-weight:600;line-height:1.5;margin:0 0 18px}
.pezzo p{font-size:17px;line-height:1.7;margin:0 0 16px}
.tab{width:100%;border-collapse:collapse;margin:6px 0 22px;font-size:15px}
.tab td{padding:10px 4px;border-bottom:1px solid var(--line)}
.tab{table-layout:fixed}.tab td:first-child{width:38%;padding-right:10px}
.tab td:last-child{text-align:right;font:700 13px 'Martian Mono';white-space:normal;overflow-wrap:anywhere;line-height:1.45}
/* 3 novembre: righe lunghe (zone del Setup XAU) uscivano dallo schermo e allargavano la pagina */
html,body{overflow-x:clip}.pezzo,.corpo{max-width:100%;min-width:0}
.nota-setup{font-size:14px;color:var(--ink3);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin:0 0 18px}
.box{border-left:4px solid var(--oro);background:color-mix(in srgb,var(--amber) 9%,var(--panel));border-radius:12px;padding:14px 18px;margin:22px 0}
.box b{display:block;margin-bottom:6px}.box ul{margin:0;padding-left:20px}.box li{margin:5px 0;line-height:1.5}
.fonti{font-size:14px;color:var(--ink2)}
.muro{position:relative;margin-top:6px;border:1.5px solid var(--amber);border-radius:20px;padding:24px 20px;text-align:center;background:var(--panel)}
.muro::before{content:'';position:absolute;left:0;right:0;top:-90px;height:90px;background:linear-gradient(transparent,var(--panel));pointer-events:none}
.muro h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 8px}
.muro p{font-size:15px;line-height:1.5;color:var(--ink2);margin:0 0 16px}
.muro .opz{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.muro small{display:block;margin-top:12px;color:var(--ink3);font-size:13px}
.finto{filter:blur(5px);user-select:none;pointer-events:none;opacity:.6}
.avviso{font-size:13px;color:var(--ink3);line-height:1.5;margin-top:22px}
.pezzo .campana{margin:16px 0 0}
/* barra in basso */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.barra-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.barra button{background:none;border:none;color:var(--ink);font:500 12px 'Archivo';display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;cursor:pointer}
.barra button svg{width:26px;height:26px}
.barra button.on{color:var(--oro)}
/* menu Altro */
.foglio{position:fixed;inset:0;z-index:50;background:rgba(10,12,11,.45);display:none}
.foglio.on{display:block}
.foglio-in{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 0 calc(90px + env(safe-area-inset-bottom))}
.foglio-in .mani{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.voce{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);font-size:17px;text-decoration:none;color:var(--ink);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-family:'Archivo';cursor:pointer}
.voce svg{width:22px;height:22px;color:var(--oro);flex:0 0 22px}
.voce small{margin-left:auto;color:var(--ink3);font-size:13px}
.legale{padding:16px 22px;font-size:12px;color:var(--ink3);line-height:1.6}
/* accesso */
.velo{position:fixed;inset:0;z-index:60;background:rgba(21,24,27,.55);display:none;align-items:center;justify-content:center;padding:18px}
.velo.on{display:flex}
.modale{background:var(--panel);border-radius:22px;padding:26px 24px;width:100%;max-width:420px;position:relative}
.modale h3{margin:0 0 6px;font-size:24px;font-family:var(--serif);font-weight:500}
.modale p{margin:0 0 16px;color:var(--ink2);line-height:1.45}
.modale label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.modale input{width:100%;font:16px 'Archivo';padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.modale .x{position:absolute;right:14px;top:12px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink)}
.modale .err{color:var(--rosso);font-size:14px;min-height:20px;margin:10px 0}
.modale .cambia{background:none;border:none;color:var(--oro);font:700 14px 'Archivo';cursor:pointer;margin-top:12px;padding:0}
.flash{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:12px;font-weight:600;z-index:70;display:none;max-width:90vw}
/* guida "aggiungi alla Home" (3 novembre 2026) */
.passi{list-style:none;margin:6px 0 18px;padding:0;counter-reset:p}
.passi li{counter-increment:p;display:flex;gap:12px;align-items:flex-start;margin:0 0 14px;line-height:1.45;color:var(--ink2)}
.passi li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--amber);color:#2B1E00;font:800 14px 'Archivo';display:grid;place-items:center}
.passi li b{color:var(--ink)}.passi svg{vertical-align:-4px}
.invito{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:41;max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 44px 14px 14px;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.4;color:var(--ink2);animation:su .35s ease-out}
.invito img{width:44px;height:44px;border-radius:11px;flex:none}.invito b{color:var(--ink)}
.invito .btn{padding:7px 12px;font-size:13.5px;margin-top:8px}
.invito .x{position:absolute;right:8px;top:6px;background:none;border:none;font-size:22px;color:var(--ink3);cursor:pointer;padding:4px 8px}
@keyframes su{from{transform:translateY(20px);opacity:0}}
body.in-ai .invito{display:none}
/* assistente AI (3 novembre 2026) */

.ai{padding:8px 16px 150px}
.ai-int{margin:18px 0 8px}.ai-int h2{font:500 28px var(--serif);margin:0 0 6px}.ai-int p{color:var(--ink2);margin:0 0 12px;line-height:1.45}
.ai-es{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.ai-es button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:15px 'Archivo';color:var(--ink);cursor:pointer}
.ai-m{margin:14px 0;line-height:1.55;font-size:16px}
.ai-m.tu{margin-left:15%;background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap}
.ai-m.ai-r{background:var(--panel);border:1px solid var(--line);padding:12px 16px;border-radius:16px 16px 16px 4px}
.ai-m.ai-r p{margin:0 0 10px}.ai-m.ai-r p:last-child{margin:0}.ai-m.ai-r ul{margin:4px 0 10px;padding-left:20px}
.ai-m .stato{color:var(--ink3);font-size:14px}
.ai-fonti{margin-top:10px;font-size:13px;color:var(--ink3)}.ai-fonti a{color:var(--ink2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-box{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:39;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px}
.ai-box form{max-width:736px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.ai-box textarea{flex:1;resize:none;font:16px 'Archivo';padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);max-height:140px}
.ai-box button{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:var(--amber);color:#2B1E00;cursor:pointer;display:grid;place-items:center}
.ai-box small{display:block;max-width:736px;margin:6px auto 0;color:var(--ink3);font-size:11.5px}
/* 3 novembre: versione per computer (Gabriele: "dal computer si vede male") */
@media (min-width:980px){
  .app{max-width:1180px;padding-bottom:40px}
  .testa .indietro2{left:24px}.testa .acc{right:24px}
  .barra{position:sticky;top:calc(62px + env(safe-area-inset-top));bottom:auto;border-top:none;border-bottom:1px solid var(--line);max-width:1180px;margin:0 auto;padding:0}
  .barra-in{max-width:none;display:flex;justify-content:center;gap:8px}
  .barra button{flex-direction:row;gap:8px;font-size:15px;padding:12px 18px;border-bottom:2px solid transparent}
  .barra button svg{width:20px;height:20px}
  .barra button.on{border-bottom-color:var(--oro)}
  #vista.v-lista{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:0 24px;padding:0 24px 30px;align-items:start}
  #vista.v-lista>*{margin-left:0;margin-right:0}
  #vista.v-lista .oggi,#vista.v-lista .sez,#vista.v-lista .altri,#vista.v-lista .vuoto{grid-column:1/-1}
  #vista.v-lista .evid{grid-column:1;margin-top:18px}
  #vista.v-lista .evid h2{font-size:32px}
  #vista.v-lista .lista{grid-column:2;grid-row:2 / span 6;margin-top:18px}
  #vista.v-lista .evid{grid-row:2}
  #vista.v-lista .abbonati,#vista.v-lista .campana{grid-column:1}
  #vista.v-lista .schede{grid-column:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .scheda{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit}
  .scheda img,.scheda .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0B0D0C}
  .scheda .txt{padding:10px 14px 14px;display:flex;flex-direction:column;gap:5px}
  .scheda h3{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.22;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .riga img,.riga .ph{flex-basis:140px;height:92px}
  .pezzo{max-width:860px;margin:24px auto 0;border-radius:20px;border:1px solid var(--line);overflow:hidden}
  .pezzo .cop{aspect-ratio:16/8;max-height:460px}
  .pezzo .corpo{padding:26px 56px 0}
  .pezzo p{font-size:18px}
  .ai{max-width:860px;margin:0 auto}
  .ai-box{bottom:0}
  .invito{bottom:24px}
}
@media(min-width:761px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media(max-width:420px){.riga img,.riga .ph{flex-basis:112px;height:78px}.riga h3{font-size:16.5px}.testata{font-size:27px}}
</style>

function aiMd(t){   // markdown minimo e sicuro: escape, poi grassetto, elenchi, paragrafi, link
  const righe = esc(t).split('\n'); let h = '', lista = false, par = [];
  const chiudiPar = () => { if(par.length){ h += '<p>' + par.join('<br>') + '</p>'; par = []; } };
  for(const r of righe){
    const li = r.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if(li){ chiudiPar(); if(!lista){ h += '<ul>'; lista = true; } h += '<li>' + li[1] + '</li>'; continue; }
    if(lista){ h += '</ul>'; lista = false; }
    if(!r.trim()){ chiudiPar(); continue; }
    par.push(r.replace(/^#+\s*/, ''));
  }
  chiudiPar(); if(lista) h += '</ul>';
  return h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function aiMsgHtml(m){
  if(m.role === 'user') return `<div class="ai-m tu">${esc(m.content)}</div>`;
  const fonti = (m.fonti || []).length ? `<div class="ai-fonti">Fonti:${m.fonti.map(f => { let d = f.url; try{ d = new URL(f.url).hostname.replace(/^www\./, ''); }catch(e){} return `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(d)} · ${esc(f.titolo)}</a>`; }).join('')}</div>` : '';
  return `<div class="ai-m ai-r">${m.content ? aiMd(m.content) : `<span class="stato">${esc(m.stato || 'Sto pensando…')}</span>`}${m.content && m.stato ? `<p class="stato">${esc(m.stato)}</p>` : ''}${fonti}</div>`;
}

      ${ACC.utente ? '<button type="button" class="btn amb" onclick="abbonati()">Abbonati</button>' : `<button type="button" class="btn pri" onclick="accApri('registrati', 'abbonati')">Crea un account</button> <button type="button" class="btn" onclick="accApri('accedi')">Accedi</button>`}</div></div>`;
    return;
  }
  v.innerHTML = `<div class="ai">${AI_STORIA.length ? '' : intro + `<div class="ai-es">${AI_ESEMPI.map(e => `<button type="button" onclick="aiChiedi(this.textContent)">${esc(e)}</button>`).join('')}</div>`}<div id="aiChat">${AI_STORIA.map(aiMsgHtml).join('')}</div></div>`;
  const box = document.createElement('div'); box.className = 'ai-box'; box.id = 'aiBox';
  box.innerHTML = `<form onsubmit="event.preventDefault();aiChiedi()"><textarea id="aiIn" rows="1" maxlength="2000" placeholder="Scrivi la tua domanda…" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();aiChiedi()}" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
    <button type="submit" aria-label="Invia"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>
    <small>Risposte generate dall'AI: possono contenere errori. Informazione educativa, non consulenza né segnali operativi.</small>`;
  document.body.appendChild(box);
  window.scrollTo(0, document.body.scrollHeight);
}
async function aiChiedi(testo){
  const inp = document.getElementById('aiIn');
  const domanda = (testo || (inp && inp.value) || '').trim();
  if(!domanda || AI_OCCUPATO) return;
  if(inp){ inp.value = ''; inp.style.height = 'auto'; }
  const storia = AI_STORIA.filter(m => m.content && !m.errore).map(m => ({ role: m.role, content: m.content }));
  AI_STORIA.push({ role: 'user', content: domanda });
  const r = { role: 'assistant', content: '', stato: 'Sto pensando…', fonti: [] }; AI_STORIA.push(r);
  AI_OCCUPATO = true; vistaAI();
  const chat = () => document.getElementById('aiChat');
  const ridisegnaUltimo = () => { const c = chat(); if(!c || !c.lastElementChild) return; const giu = innerHeight + scrollY > document.body.scrollHeight - 200; c.lastElementChild.outerHTML = aiMsgHtml(r); if(giu) window.scrollTo(0, document.body.scrollHeight); };
  try{
    const { data } = await sb.auth.getSession();
    const res = await fetch(AI_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session ? data.session.access_token : '') }, body: JSON.stringify({ domanda, storia }) });
    if(!res.ok || !res.body){ let m = 'Non sono riuscito a rispondere, riprova.'; try{ m = (await res.json()).errore || m; }catch(e){} throw new Error(m); }
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '', t0 = 0;
    for(;;){
      const { value, done } = await rd.read(); if(done) break;
      buf += dec.decode(value, { stream: true });
      let i; while((i = buf.indexOf('\n\n')) >= 0){
        const riga = buf.slice(0, i).replace(/^data:\s*/, ''); buf = buf.slice(i + 2);
        let ev; try{ ev = JSON.parse(riga); }catch(e){ continue; }
        if(ev.t){ r.content += ev.t; r.stato = ''; }
        if(ev.cerca !== undefined) r.stato = 'Cerco le ultime notizie…';
        if(ev.fonti) r.fonti = ev.fonti;
        if(ev.errore) throw new Error(ev.errore);
        if(ev.fine && ev.rimaste != null && ev.rimaste <= 5) r.stato = ev.rimaste ? `Ti restano ${ev.rimaste} domande oggi.` : 'Hai finito le domande di oggi.';
      }
      if(Date.now() - t0 > 80){ t0 = Date.now(); ridisegnaUltimo(); }
    }
    if(!r.content) throw new Error('Non sono riuscito a rispondere, riprova.');
  }catch(e){ r.errore = true; r.content = ''; r.stato = (e && e.message) || 'Non sono riuscito a rispondere, riprova.'; }
  AI_OCCUPATO = false;
  if(location.hash.replace(/^#\/?/, '') === 'ai') ridisegnaUltimo();
}

async function guidaInstalla(){ const e = GUIDA.evento; if(!e) return; guidaChiudi(); e.prompt(); try{ await e.userChoice; }catch(x){} GUIDA.evento = null; }
function guidaStato(){ try{ return JSON.parse(localStorage.getItem('riskly-guida') || '{}'); }catch(e){ return {}; } }
function guidaSalva(o){ try{ localStorage.setItem('riskly-guida', JSON.stringify(Object.assign(guidaStato(), o))); }catch(e){} }
function invitoChiudi(per){ const el = document.getElementById('invito'); if(!el) return; el.remove(); if(per !== true){ const g = guidaStato(); guidaSalva({ chiusi: (g.chiusi || 0) + 1, ultimo: Date.now() }); } }
function invito(){
  if(GUIDA.app || (!GUIDA.ios && !GUIDA.evento)) return;
  const g = guidaStato(), visite = (g.visite || 0) + 1; guidaSalva({ visite });
  if(g.fatto || visite < 2 || (g.chiusi || 0) >= 3 || (g.ultimo && Date.now() - g.ultimo < 5 * 864e5)) return;
  setTimeout(() => {
    if(document.getElementById('invito') || document.querySelector('.velo.on')) return;
    guidaSalva({ ultimo: Date.now() });
    const el = document.createElement('div'); el.className = 'invito'; el.id = 'invito';
    el.innerHTML = `<img src="/apple-touch-icon.png" alt=""><div><b>Tieni Riskly News sul telefono</b><br>Aprilo come un'app e ricevi un avviso a ogni articolo.<br><button type="button" class="btn amb" onclick="guidaApri()">${GUIDA.ios ? 'Come si fa' : 'Installa'}</button></div><button type="button" class="x" onclick="invitoChiudi()" aria-label="Chiudi">×</button>`;
    document.body.appendChild(el);
  }, 8000);
}

/* ---------- abbonamento ---------- */
function abbonati(tipo){
  if(!ACC.utente){ accApri('registrati', 'abbonati'); return; }
  if(ACC.accesso){ flash('Sei già abbonato.'); return; }
  const link = PAGA[tipo || 'mensile'] || PAGA.mensile;
  if(!link){ flash('L\'abbonamento apre a breve.'); return; }
  const u = new URL(link);
  u.searchParams.set('client_reference_id', ACC.utente.id);
  if(ACC.utente.email) u.searchParams.set('prefilled_email', ACC.utente.email);
  location.href = u.toString();
}

/* ---------- account (lo stesso di riskly.trade e del journal) ---------- */
function accModo(m){
  ACC.modo = m;
  const reg = m === 'registrati';
  document.getElementById('accTit').textContent = reg ? 'Crea un account' : 'Accedi';
  document.getElementById('accSub').textContent = reg ? 'Gratis. Lo stesso account vale per riskly.trade e per il journal.' : 'Usa lo stesso account di riskly.trade e del journal.';
  document.getElementById('accNomeBox').hidden = !reg;
  document.getElementById('accInvio').textContent = reg ? 'Crea account' : 'Accedi';
  document.getElementById('accCambia').textContent = reg ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati gratis';
  document.getElementById('accPass').autocomplete = reg ? 'new-password' : 'current-password';
  document.getElementById('accErr').textContent = '';
}
function accApri(m, dopo){ ACC.dopo = dopo || null; accModo(m || 'accedi'); document.getElementById('velo').classList.add('on'); setTimeout(() => document.getElementById('accEmail').focus(), 50); }
function accChiudi(){ document.getElementById('velo').classList.remove('on'); }
async function accPulsante(){
  if(!ACC.utente){ accApri('accedi'); return; }
  if(confirm('Vuoi uscire dal tuo account?')){ await sb.auth.signOut(); }
}
async function accInvia(e){
  e.preventDefault();
  const email = document.getElementById('accEmail').value.trim(), pass = document.getElementById('accPass').value, err = document.getElementById('accErr');
  err.textContent = '';
  try{
    if(ACC.modo === 'registrati'){
      const nome = document.getElementById('accNome').value.trim();
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + '/', data: { nome } } });
      if(error) throw error;
      if(!data.session){ err.style.color = 'var(--verde)'; err.textContent = 'Ti abbiamo mandato un\'email: conferma l\'indirizzo e poi accedi.'; return; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
    }
    accChiudi();
    if(ACC.dopo === 'abbonati') setTimeout(() => abbonati(), 600);
  }catch(x){
    const m = (x && x.message) || String(x);
    err.style.color = ''; err.textContent = /Invalid login/i.test(m) ? 'Email o password non corrette.' : /already registered/i.test(m) ? 'Questa email ha già un account: accedi.' : 'Non è andata: ' + m;
  }
}
async function aggiornaUtente(sessione){
  ACC.utente = sessione ? sessione.user : null;
  document.getElementById('accBtn').title = ACC.utente ? 'Esci (' + (ACC.utente.email || '') + ')' : 'Accedi';
  await controllaAccesso();
  vista();
}

/* ---------- avvio ---------- */
(async () => {
  if(!sb){ document.getElementById('vista').innerHTML = '<p class="vuoto">Non riesco a collegarmi. Ricarica la pagina.</p>'; return; }
  try{ await caricaAnteprime(); }catch(e){ document.getElementById('vista').innerHTML = '<p class="vuoto">Gli articoli non sono disponibili adesso. Riprova tra poco.</p>'; return; }
  const { data } = await sb.auth.getSession();
  await aggiornaUtente(data.session);
  /* ritorno dal pagamento: il webhook di Stripe attiva l'abbonamento in pochi secondi */
  if(/[?&]abbonato=1/.test(location.search)){
    history.replaceState(null, '', location.pathname + location.hash);
    flash('Grazie! Sto attivando il tuo abbonamento…');
    for(let i = 0; i < 6 && !ACC.accesso; i++){ await new Promise(r => setTimeout(r, 2500)); await controllaAccesso(); }
    vista();
    flash(ACC.accesso ? 'Abbonamento attivo: buona lettura!' : 'Pagamento ricevuto. Se gli articoli restano chiusi, ricarica la pagina tra un minuto.');
  }
  invito();
  sb.auth.onAuthStateChange((ev, s) => { if(ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') aggiornaUtente(s); });
})();
