<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Riskly · reel sponsor</title>
<style>
@font-face{font-family:'ISerif';src:url(../../nuovo/riskly/fonts/InstrumentSerif-400-normal-latin.woff2) format('woff2');font-style:normal}
@font-face{font-family:'ISerif';src:url(../../nuovo/riskly/fonts/InstrumentSerif-400-italic-latin.woff2) format('woff2');font-style:italic}
@font-face{font-family:'ISans';src:url(../../nuovo/riskly/fonts/InstrumentSans-600-normal-latin.woff2) format('woff2');font-weight:600}

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Reel sponsor Riskly (1080x1920). Tutto disegnato a canvas in funzione del tempo: disegna(t) è deterministico, così ogni fotogramma si può rendere.
   Scene: 0 hook · 1 la perdita · 2 cosa è Riskly · 3 i quattro prodotti · 4 journal e calcolatori · 5 invito.
   I grafici e i numeri sono illustrazioni, non operazioni reali (c'è scritto nel video). */
const V = new URLSearchParams(location.search).get('v') || 'prodotti';
const W = 1080, H = 1920, cv = document.getElementById('c'), g = cv.getContext('2d');
const NAVY = '#0A1626', NAVY2 = '#12263F', ORO = '#D4AE5A', ORO2 = '#F1D58F', ACC = '#6FA3D4', ROSSO = '#E5594F', VERDE = '#4FBF8F', BIANCO = '#F4F1EA';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const eo = x => 1 - Math.pow(1 - clamp(x), 3), eio = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const ob = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const seme = n => { let s = (n * 9301 + 49297) % 233280; return () => (s = (s * 9301 + 49297) % 233280) / 233280; };
let S = [], PAROLE = [], TOT = 0;
window.prepara = (durate, parole) => {
  PAROLE = parole; let t = 0; S = durate.map((d, i) => { const o = { ini: t, dur: Math.max(d + (i === durate.length - 1 ? 1.0 : 0.45), i === 0 ? 4.2 : 3.2) }; t += o.dur; return o; });
  TOT = t; return t;
};
const scena = t => { let i = S.findIndex(s => t >= s.ini && t < s.ini + s.dur); return i < 0 ? S.length - 1 : i; };
const trova = (i, p) => { const w = PAROLE[i].find(x => x[1].toLowerCase().replace(/[^a-zà-ù]/g, '').startsWith(p)); return w ? w[0] : 0; };

/* raggi di luce che ruotano dietro al titolo */
function raggi(cx, cy, t, a){ if(a <= 0) return; g.save(); g.globalCompositeOperation = 'lighter'; g.translate(cx, cy); g.rotate(t * .12);
  for(let k = 0; k < 14; k++){ g.rotate(6.28 / 14); const gr = g.createLinearGradient(0, 0, 0, 1100); gr.addColorStop(0, `rgba(241,213,143,${a * .22})`); gr.addColorStop(1, 'rgba(241,213,143,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(-10, 0); g.lineTo(10, 0); g.lineTo(46, 1100); g.lineTo(-46, 1100); g.fill(); } g.restore(); }
/* crepe del vetro: linee spezzate che partono dal punto d'impatto */
function crepe(cx, cy, q){ if(q <= 0) return; const r = seme(21); g.save(); g.strokeStyle = `rgba(255,255,255,${.85 * (1 - clamp((q - .6) / .4))})`; g.lineWidth = 2.5; g.shadowColor = '#fff'; g.shadowBlur = 8;
  for(let k = 0; k < 16; k++){ let a = r() * 6.28, x = cx, y = cy; g.beginPath(); g.moveTo(x, y); const n = Math.floor(4 + r() * 6 * eo(q * 1.4)); for(let j = 0; j < n; j++){ a += (r() - .5) * .8; const d = 40 + r() * 110; x += Math.cos(a) * d; y += Math.sin(a) * d; g.lineTo(x, y); } g.stroke(); } g.restore(); }
/* --- elementi comuni --- */
const polvere = Array.from({ length: 90 }, (_, k) => { const r = seme(k + 3); return { x: r() * W, y: r() * H, z: .3 + r() * .9, v: 6 + r() * 22, f: r() * 6.28 }; });
function sfondo(t, push){
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#050B14'); gr.addColorStop(.55, NAVY); gr.addColorStop(1, '#0E2036');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  /* pavimento a griglia in prospettiva */
  g.save(); g.beginPath(); g.rect(0, H * .62, W, H * .38); g.clip();
  const hz = H * .62, fuga = W / 2; g.strokeStyle = 'rgba(111,163,212,.16)'; g.lineWidth = 2;
  for(let k = -14; k <= 14; k++){ g.beginPath(); g.moveTo(fuga + k * 14, hz); g.lineTo(fuga + k * 190, H); g.stroke(); }
  const sc = (t * .35 + push * .2) % 1;
  for(let k = 0; k < 14; k++){ const z = (k + sc) / 14, y = hz + Math.pow(z, 2.2) * (H - hz); g.globalAlpha = .1 + z * .35; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.restore(); g.globalAlpha = 1;
  const hg = g.createLinearGradient(0, hz - 90, 0, hz + 40); hg.addColorStop(0, 'rgba(212,174,90,0)'); hg.addColorStop(.7, 'rgba(212,174,90,.16)'); hg.addColorStop(1, 'rgba(212,174,90,0)');
  g.fillStyle = hg; g.fillRect(0, hz - 90, W, 130);
  /* polvere che sale */
  for(const p of polvere){ const y = ((p.y - t * p.v * p.z) % H + H) % H, x = p.x + Math.sin(t * .6 + p.f) * 18 * p.z; g.globalAlpha = .08 + p.z * .35 * (.6 + .4 * Math.sin(t * 2 + p.f));
    g.fillStyle = p.z > .8 ? ORO2 : '#9FC4E6'; g.beginPath(); g.arc(x, y, 1 + p.z * 2.2, 0, 6.28); g.fill(); }
  g.globalAlpha = 1;
}
function vignetta(){ const v = g.createRadialGradient(W/2, H/2, H * .28, W/2, H/2, H * .78); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.62)'); g.fillStyle = v; g.fillRect(0, 0, W, H); }
function grana(f){ const r = seme(f * 7 + 1); g.fillStyle = '#fff'; for(let k = 0; k < 260; k++){ g.globalAlpha = .03 + r() * .06; g.fillRect(r() * W, r() * H, 2, 2); } g.globalAlpha = 1; }
function testo(s, x, y, font, col, al = 'center', ls = 0){ g.font = font; g.fillStyle = col; g.textAlign = al; g.textBaseline = 'alphabetic'; if('letterSpacing' in g) g.letterSpacing = ls + 'px'; g.fillText(s, x, y); if('letterSpacing' in g) g.letterSpacing = '0px'; }
function bagliore(x, y, r, col, a){ const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col.replace('A', a)); gr.addColorStop(1, col.replace('A', 0)); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
/* striscia di luce orizzontale (flare anamorfico) */
function flare(x, y, w, a){ if(a <= 0) return; g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createLinearGradient(x - w, 0, x + w, 0); gr.addColorStop(0, 'rgba(111,163,212,0)'); gr.addColorStop(.5, `rgba(255,236,190,${a})`); gr.addColorStop(1, 'rgba(111,163,212,0)'); g.fillStyle = gr; g.fillRect(x - w, y - 3, w * 2, 6); bagliore(x, y, 140, 'rgba(255,225,160,A)', a * .5); g.restore(); }
/* testo con split RGB (glitch) */
function glitch(s, x, y, font, k){ if(k <= 0){ testo(s, x, y, font, BIANCO); return; } g.save(); g.globalCompositeOperation = 'lighter';
  testo(s, x - 14 * k, y, font, 'rgba(255,40,60,.85)'); testo(s, x + 14 * k, y, font, 'rgba(40,200,255,.85)'); testo(s, x, y, font, 'rgba(255,255,255,.7)'); g.restore(); }

/* --- sottotitoli: gruppi da 3 parole, la parola detta in oro --- */
function sottotitoli(i, tl){
  const P = PAROLE[i]; if(!P || !P.length) return; let k = -1; P.forEach((w, j) => { if(w[0] - .05 <= tl) k = j; }); if(k < 0) return;
  const gi = Math.floor(k / 3), gr = P.slice(gi * 3, gi * 3 + 3), fnt = '600 60px ISans';
  g.font = fnt; if('letterSpacing' in g) g.letterSpacing = '0px';
  const larg = gr.map(w => g.measureText(w[1]).width + 22), tot = larg.reduce((a, b) => a + b, 0) - 22; let x = W / 2 - tot / 2, y = 1560;
  const ent = eo((tl - gr[0][0] + .05) / .14);
  g.fillStyle = 'rgba(5,11,20,.55)'; const pw = tot + 70; g.beginPath(); g.roundRect(W/2 - pw/2, y - 78, pw, 112, 18); g.fill();
  gr.forEach((w, j) => { const attiva = gi * 3 + j === k; g.globalAlpha = ent; testo(w[1], x, y - 4 + (1 - ent) * 12, fnt, attiva ? ORO2 : BIANCO, 'left'); x += larg[j]; }); g.globalAlpha = 1;
}
function testata(t, vis){
  if(vis <= 0) return; g.globalAlpha = vis;
  testo('RISKLY', 80, 118, '600 34px ISans', BIANCO, 'left', 9); g.fillStyle = ORO; g.fillRect(80, 138, 54, 3);
  testo('riskly.trade', W - 80, 118, '500 30px IMono', 'rgba(244,241,234,.7)', 'right'); g.globalAlpha = 1;
}
function avviso(){ testo('Contenuto promozionale · Riskly è un mio prodotto · Non è consulenza finanziaria', W/2, 1796, '500 22px IMono', 'rgba(244,241,234,.55)');
  testo('Il trading con leva comporta un alto rischio di perdita del capitale', W/2, 1828, '500 22px IMono', 'rgba(244,241,234,.55)'); }

const HOOK = {
  prodotti: ['Il mercato', 'non lo controlli.', 'Le tue regole sì.', 'GUARDA COSA SUCCEDE ALLA TERZA PERDITA'],
  news: ['Quando il mercato', 'si muove,', 'lo sai subito.', 'GUARDA COME'],
  calc: ['Quanto rischi', 'davvero?', 'Fallo calcolare.', 'BASTANO TRE NUMERI'],
  journal: ['Sai davvero', 'perché perdi?', 'I numeri lo dicono.', 'GUARDA IL TUO JOURNAL'] }[V];
/* --- scena 0: gancio --- */
function mercato(t, tl){
  /* linea di mercato (passeggiata casuale deterministica) che scorre dietro */
  const r = seme(11); const pts = []; let y = 0; for(let k = 0; k < 140; k++){ y += (r() - .5) * 60; pts.push(y); }
  g.save(); g.lineWidth = 4; g.lineJoin = 'round'; const off = tl * 120; const grad = g.createLinearGradient(0, 0, W, 0); grad.addColorStop(0, 'rgba(111,163,212,0)'); grad.addColorStop(.3, 'rgba(111,163,212,.9)'); grad.addColorStop(1, 'rgba(111,163,212,.25)');
  g.strokeStyle = grad; g.shadowColor = ACC; g.shadowBlur = 24; g.beginPath(); pts.forEach((v, k) => { const px = k * 22 - off, py = 1130 + v * .8; k ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke(); g.restore();
  const a1 = ob(tl / .7), bl = 1 - clamp(tl / .6);
  g.save(); g.globalAlpha = clamp(tl / .25); g.filter = `blur(${bl * 18}px)`; const z = 1.9 - .9 * eo(tl / .35) + .04 * Math.sin(tl * 2);
  g.translate(W/2, 560); g.scale(z, z); g.translate(-W/2, -560);
  testo(HOOK[0], W/2, 520, '400 150px ISerif', BIANCO); testo(HOOK[1], W/2, 690, 'italic 400 150px ISerif', BIANCO); g.restore(); g.filter = 'none';
  if(tl < .3){ g.fillStyle = `rgba(255,245,220,${(1 - tl / .3) * .85})`; g.fillRect(0, 0, W, H); }
  /* scanner: linea di luce che attraversa il grafico */
  const sx = ((tl * 700) % (W + 400)) - 200; g.save(); g.globalCompositeOperation = 'lighter'; const sg = g.createLinearGradient(sx - 120, 0, sx + 8, 0); sg.addColorStop(0, 'rgba(111,163,212,0)'); sg.addColorStop(1, 'rgba(180,220,255,.45)'); g.fillStyle = sg; g.fillRect(sx - 120, 940, 128, 380); g.restore();
  const a2 = eo((tl - 1.45) / .6);
  if(a2 > 0){ g.save(); g.globalAlpha = a2; const dy = (1 - a2) * 50; testo(HOOK[2], W/2, 930 + dy, '400 120px ISerif', ORO2); g.restore(); }
  flare(lerp(-300, W + 300, eio((tl - 1.3) / 1.1)), 800, 380, Math.sin(clamp((tl - 1.3) / 1.1) * Math.PI) * .9);
  const tz = clamp((tl - 2.3) / .4); if(tz > 0){ const pul = .65 + .35 * Math.sin(tl * 9); g.globalAlpha = tz * pul; testo(HOOK[3], W/2, 1010, '500 30px IMono', ORO2, 'center', 3); g.globalAlpha = 1; testo('▼', W/2, 1060, '500 40px IMono', ORO2); }
}

/* --- scena 1: la perdita (simulazione) --- */
function perdita(t, tl){
  /* 3 candele rosse di fila, poi la quarta tratteggiata che non si apre */
  const bx = 150, passo = 190, y0 = 760; const lung = [ [0, 120], [120, 250], [250, 400] ];
  testo('SIMULAZIONE ILLUSTRATIVA', W/2, 300, '500 28px IMono', 'rgba(244,241,234,.6)', 'center', 4);
  for(let k = 0; k < 3; k++){
    const a = ob((tl - .2 - k * .85) / .45); if(a <= 0) continue; const x = bx + k * passo + 40, h = lung[k][1] - lung[k][0], top = y0 + lung[k][0];
    g.save(); g.globalAlpha = clamp(a); g.shadowColor = ROSSO; g.shadowBlur = 26; g.fillStyle = ROSSO; g.fillRect(x - 38, top, 76, h * a); g.fillRect(x - 3, top - 36, 6, h * a + 72); g.restore();
    testo('−' + (k + 1), x, top - 56, '500 32px IMono', ROSSO);
  }
  /* quarta: appare tratteggiata, con scritta "per recuperare" */
  const q = eo((tl - 3.0) / .5);
  if(q > 0){ const x = bx + 3 * passo + 40; g.save(); g.globalAlpha = q; g.setLineDash([14, 10]); g.strokeStyle = ORO; g.lineWidth = 4; g.strokeRect(x - 38, y0 + 400, 76, 150 * q); g.restore();
    testo('?', x, y0 + 380, '500 56px IMono', ORO); }
  /* battito: il bordo pulsa di rosso a ogni perdita */
  for(let k = 0; k < 3; k++){ const q = (tl - .2 - k * .85) / .8; if(q > 0 && q < 1){ const v = g.createRadialGradient(W/2, H/2, H * .3, W/2, H/2, H * .75); v.addColorStop(0, 'rgba(229,89,79,0)'); v.addColorStop(1, `rgba(229,89,79,${(1 - q) * .45})`); g.fillStyle = v; g.fillRect(0, 0, W, H); } }
  crepe(bx + 2 * passo + 40, y0 + 330, clamp((tl - 2.05) / 1.2));
  /* colpo alla terza: sfarfallio rosso + glitch del titolo */
  const imp = Math.max(0, 1 - Math.abs(tl - 2.05) / .3);
  if(imp > 0){ g.save(); g.fillStyle = ROSSO; g.globalAlpha = imp * .22; g.fillRect(0, 0, W, H); g.restore(); }
  const gl = Math.max(0, 1 - Math.abs(tl - 2.05) / .45);
  g.save(); const sh = (Math.sin(tl * 90) * 10) * imp; g.translate(sh, 0);
  glitch('TERZA PERDITA', W/2, 520, '400 130px ISerif', gl); g.restore();
  const pz = eo((tl - 2.2) / .5); if(pz > 0){ g.globalAlpha = pz; testo('e adesso, la quarta?', W/2, 620, 'italic 400 70px ISerif', ORO2); g.globalAlpha = 1; }
}

/* --- scena 2: cosa è Riskly (onda d'urto + due negazioni) --- */
function cosa(t, tl){
  const cx = W/2, cy = 700;
  for(let k = 0; k < 4; k++){ const q = clamp((tl - .05 - k * .16) / 1.3); if(q <= 0 || q >= 1) continue; g.save(); g.strokeStyle = `rgba(212,174,90,${(1 - q) * .8})`; g.lineWidth = 10 * (1 - q) + 2; g.beginPath(); g.arc(cx, cy, eo(q) * 700, 0, 6.28); g.stroke(); g.restore(); }
  raggi(cx, cy, t, eo((tl - .3) / 1));
  bagliore(cx, cy, 520, 'rgba(111,163,212,A)', .35 * eo(tl / .8));
  /* particelle che convergono in "RISKLY" */
  const ar = eo((tl - .15) / .9); const r = seme(5);
  g.save(); g.globalCompositeOperation = 'lighter'; for(let k = 0; k < 120; k++){ const a0 = r() * 6.28, d0 = 380 + r() * 700, q = clamp(ar * 1.2 - r() * .2), d = d0 * (1 - eo(q)); g.fillStyle = k % 3 ? 'rgba(241,213,143,.8)' : 'rgba(159,196,230,.8)'; g.beginPath(); g.arc(cx + Math.cos(a0) * d, cy + Math.sin(a0) * d * .8, 3, 0, 6.28); g.fill(); } g.restore();
  g.save(); g.globalAlpha = eo((tl - .5) / .5); const z = 1 + (1 - eo((tl - .5) / .8)) * .15; g.translate(cx, cy); g.scale(z, z);
  testo('RISKLY', 0, 40, '400 200px ISerif', BIANCO, 'center', 14); g.restore();
  const lg = eo((tl - 1.0) / .6); g.fillStyle = ORO; g.fillRect(cx - 230 * lg, cy + 80, 460 * lg, 4);
  const a = eo((tl - 1.2) / .5); if(a > 0){ g.globalAlpha = a; testo('5 software per MetaTrader 4 e 5', cx, cy + 160, '600 44px ISans', 'rgba(244,241,234,.9)'); g.globalAlpha = 1; }
  /* due negazioni barrate */
  [['Non aprono operazioni', 3.05, 1080], ['Non danno segnali', 4.4, 1200]].forEach(([s, tt, y]) => {
    const e = eo((tl - tt) / .4); if(e <= 0) return; const sl = eo((tl - tt - .55) / .35);
    g.save(); g.globalAlpha = e; g.fillStyle = 'rgba(18,38,63,.85)'; g.strokeStyle = 'rgba(212,174,90,.5)'; g.lineWidth = 2; g.beginPath(); g.roundRect(150, y, 780, 96, 14); g.fill(); g.stroke();
    testo(s, W/2, y + 64, '600 46px ISans', BIANCO); g.fillStyle = ROSSO; g.fillRect(190, y + 48, 700 * sl, 5); g.restore();
  });
  const e = eo((tl - 6.4) / .5); if(e > 0){ g.globalAlpha = e; testo('Fanno rispettare le TUE regole.', W/2, 1380, 'italic 400 76px ISerif', ORO2); g.globalAlpha = 1; }
}

/* --- scena 3: i quattro prodotti, schede con luce che scorre --- */
const PROD = [
  { nome: 'RiskGuard', riga: 'Ti ferma dopo N perdite di fila', parola: 'riskguard' },
  { nome: 'TradeManager', riga: 'Stop a pareggio e trailing stop', parola: 'trademanager' },
  { nome: 'ScaleIn', riga: 'Più take profit sulla stessa posizione', parola: 'scalein' },
  { nome: 'Riskly Pro', riga: 'I tre insieme, rischio sull\'insieme', parola: 'riskly' },
  { nome: 'RisklyCopy', riga: 'Copia su altri conti, stesso rischio', parola: 'copy' },
];
function icona(k, cx, cy, p, t){
  g.save(); g.translate(cx, cy); g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round'; g.shadowColor = ORO; g.shadowBlur = 20; g.strokeStyle = ORO2;
  if(k === 0){ /* scudo con barre di pausa */
    g.beginPath(); g.moveTo(0, -90); g.lineTo(78, -58); g.lineTo(70, 20); g.quadraticCurveTo(52, 70, 0, 96); g.quadraticCurveTo(-52, 70, -70, 20); g.lineTo(-78, -58); g.closePath(); g.globalAlpha = p; g.stroke();
    g.fillStyle = ORO2; g.fillRect(-26, -30, 14, 62 * eo(p * 1.4)); g.fillRect(12, -30, 14, 62 * eo(p * 1.4));
  } else if(k === 1){ /* prezzo e stop che sale a gradini */
    g.beginPath(); g.moveTo(-95, 60); g.lineTo(-40, 10); g.lineTo(0, 30); g.lineTo(60, -50); g.lineTo(95, -40); g.globalAlpha = p; g.stroke(); g.setLineDash([12, 10]); g.strokeStyle = ACC; g.beginPath(); const s = eo(p * 1.2);
    g.moveTo(-95, 80); g.lineTo(-40, 80); g.lineTo(-40, 60 * (1 - s) + 80 * s - 20 * s); g.lineTo(10, 60 - 20 * s); g.lineTo(10, 40 - 20 * s); g.lineTo(95, 40 - 20 * s); g.stroke();
  } else if(k === 2){ /* tre take profit */
    for(let j = 0; j < 3; j++){ const e = eo(p * 1.5 - j * .3); g.globalAlpha = e; g.beginPath(); g.moveTo(-90, 60 - j * 50); g.lineTo(-90 + 180 * e, 60 - j * 50); g.stroke(); g.fillStyle = ORO2; g.beginPath(); g.arc(-90 + 180 * e, 60 - j * 50, 8, 0, 6.28); g.fill(); }
  } else if(k === 4){ /* un conto principale che copia su due conti */
    g.globalAlpha = p; g.beginPath(); g.arc(-60, 0, 30, 0, 6.28); g.stroke(); g.setLineDash([10, 9]); g.strokeStyle = ACC;
    [[70, -50], [70, 50]].forEach(([x, y], j) => { const e = eo(p * 1.4 - j * .25); g.beginPath(); g.moveTo(-26, 0); g.lineTo(-26 + (x - 26 + 26) * e, y * e); g.stroke(); g.setLineDash([]); g.strokeStyle = ORO2; g.beginPath(); g.arc(x, y, 22 * e, 0, 6.28); g.stroke(); g.setLineDash([10, 9]); g.strokeStyle = ACC; });
  } else { /* i tre simboli uniti dentro un anello */
    g.globalAlpha = p; g.beginPath(); g.arc(0, 0, 92, 0, 6.28 * eo(p)); g.stroke();
    g.save(); g.rotate(t * .8); g.setLineDash([6, 18]); g.strokeStyle = ACC; g.beginPath(); g.arc(0, 0, 112, 0, 6.28); g.stroke(); g.restore();
    g.fillStyle = ORO2; g.fillRect(-12, -40, 8, 40); g.fillRect(4, -40, 8, 40); g.beginPath(); g.moveTo(-50, 40); g.lineTo(-10, 12); g.lineTo(20, 28); g.lineTo(52, -4); g.stroke();
  }
  g.restore();
}
function prodotti(t, tl){

  if(i > 0){ const f = Math.max(0, 1 - tl / .25); if(f > 0){ g.fillStyle = `rgba(255,236,200,${f * .28})`; g.fillRect(0, 0, W, H); } }
  const fin = clamp((t - (TOT - .6)) / .6), ini = 1 - clamp(t / .08); if(fin + ini > 0){ g.fillStyle = `rgba(5,11,20,${Math.max(fin, ini)})`; g.fillRect(0, 0, W, H); }
  grana(Math.round(t * 25));
};
