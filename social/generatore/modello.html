<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14; --panel:#131C28; --line:#1E2A3A;
    --text:#E6EDF3; --dim:#8B98A9; --dim2:#5D6B7D;
    --up:#22C55E; --down:#EF4444; --blue:#0EA5E9;
    --grad:linear-gradient(135deg,#22C55E,#0EA5E9);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  body{font-family:'Instrument Sans',sans-serif;color:var(--text);position:relative}
  .sfondo{position:absolute;inset:0;
    background:radial-gradient(900px 700px at 80% 8%,rgba(34,197,94,.16),transparent 62%),
               radial-gradient(800px 640px at 10% 78%,rgba(14,165,233,.12),transparent 64%)}
  .griglia{position:absolute;inset:0;opacity:.07;
    background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);
    background-size:90px 90px}

  /* barra di avanzamento e marchio: fuori dalle zone coperte dall'interfaccia delle app */
  .avanz{position:absolute;top:120px;left:90px;right:90px;height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
  .avanz i{display:block;height:100%;width:0;background:var(--grad)}
  .marchio{position:absolute;top:160px;left:90px;display:flex;align-items:center;gap:16px;
    font-weight:700;font-size:40px;letter-spacing:-.02em}
  .marchio small{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:26px;color:var(--dim2);margin-left:6px}

  /* area sicura: sotto 380px ci sono didascalia e pulsanti di TikTok/Reels, a destra le icone */
  .scena{position:absolute;left:90px;right:150px;top:300px;bottom:420px;
    display:flex;flex-direction:column;justify-content:center;opacity:0}
  .el{opacity:0;will-change:transform,opacity}

  .kicker{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:30px;letter-spacing:.08em;
    color:var(--up);margin-bottom:40px}
  .grande{font-family:'Instrument Serif',serif;font-size:112px;line-height:1.04;letter-spacing:-.02em}
  .grande em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .medio{font-family:'Instrument Serif',serif;font-size:84px;line-height:1.1;letter-spacing:-.015em}
  .medio em{font-style:italic;color:var(--up)}
  .nota{font-size:36px;line-height:1.45;color:var(--dim);margin-top:44px}

  .titolo-b{font-size:44px;font-weight:600;line-height:1.3;margin-bottom:54px}
  .riga-b{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:26px;margin-bottom:34px}
  .riga-b .et{font-family:'JetBrains Mono',monospace;font-size:44px;color:var(--down);text-align:right}
  .riga-b .pista{height:78px;border-radius:14px;background:rgba(255,255,255,.04);position:relative}
  .riga-b .pista i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:14px;background:var(--grad)}
  .riga-b .pista b{position:absolute;top:50%;transform:translateY(-50%);font-family:'JetBrains Mono',monospace;
    font-size:40px;color:#08110c;left:22px;white-space:nowrap}
  .riga-b .pista b.fuori{color:var(--text)}

  .cifra{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:230px;line-height:1;letter-spacing:-.04em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cifra.rossa{background:none;color:var(--down)}
  .etichetta{font-size:48px;line-height:1.35;color:var(--text);margin-top:30px;font-weight:500}

  .lista .voce{display:flex;gap:30px;align-items:flex-start;font-size:52px;line-height:1.3;margin-bottom:46px;font-weight:500}
  .lista .voce .n{flex:0 0 76px;height:76px;border-radius:50%;display:grid;place-items:center;
    font-family:'JetBrains Mono',monospace;font-size:34px;color:#08110c;background:var(--grad);margin-top:-4px}
  .lista .voce small{display:block;font-size:36px;color:var(--dim);font-weight:400;margin-top:8px}

  .card{background:rgba(19,28,40,.85);border:2px solid var(--line);border-radius:36px;padding:54px 56px}
  .card .r{display:flex;justify-content:space-between;align-items:baseline;font-size:44px;padding:22px 0;border-top:2px solid var(--line)}
  .card .r:first-child{border-top:none}
  .card .r span{color:var(--dim)}
  .card .r b{font-family:'JetBrains Mono',monospace;font-weight:600}
  .card .r b.up{color:var(--up)} .card .r b.down{color:var(--down)}

  .chiusura{align-items:flex-start}
  .chiusura .logo{display:flex;align-items:center;gap:26px;font-weight:700;font-size:96px;letter-spacing:-.03em;margin-bottom:44px}
  .chiusura .claim{font-family:'Instrument Serif',serif;font-size:78px;line-height:1.1;margin-bottom:56px}
  .chiusura .claim em{font-style:italic;color:var(--up)}
  .chiusura .pill{display:inline-block;background:var(--grad);color:#08110c;font-weight:700;font-size:46px;
    border-radius:100px;padding:30px 54px;margin-bottom:34px}
  .chiusura .piccolo{font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--dim2);line-height:1.6}
</style>
</head>
<body>
<div class="sfondo"></div><div class="griglia"></div>
<div class="avanz"><i id="avanz"></i></div>
<div class="marchio">
  <svg width="54" height="54" viewBox="0 0 44 44" fill="none"><path d="M9 31 L17 19.5 L23.5 25 L35 11" stroke="#22C55E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 36 H35" stroke="#8B98A9" stroke-width="2.6" stroke-linecap="round"/></svg>
  Riskly <small>riskly.trade</small>
</div>
<div id="scene"></div>

<script>
/* ogni scena ha una durata; ogni elemento con data-d compare dopo d secondi */
const LOGO = '<svg width="120" height="120" viewBox="0 0 44 44" fill="none"><path d="M9 31 L17 19.5 L23.5 25 L35 11" stroke="#22C55E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 36 H35" stroke="#8B98A9" stroke-width="2.6" stroke-linecap="round"/></svg>';

let SPEC = null, INIZI = [], TOTALE = 0;

const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);

function righe(testo, cls, d0, passo){
  return testo.map((t,i) => `<div class="el ${cls}" data-d="${(d0 + i*passo).toFixed(2)}">${t}</div>`).join('');
}

function costruisci(s){
  switch(s.tipo){
    case 'hook':
      return (s.kicker ? `<div class="el kicker" data-d="0">${s.kicker}</div>` : '')
           + righe(s.testo, 'grande', .15, .45)
           + (s.nota ? `<div class="el nota" data-d="${(.3 + s.testo.length*.45).toFixed(2)}">${s.nota}</div>` : '');
    case 'frase':
      return (s.kicker ? `<div class="el kicker" data-d="0">${s.kicker}</div>` : '')
           + righe(s.testo, 'medio', .1, .5)
           + (s.nota ? `<div class="el nota" data-d="${(.3 + s.testo.length*.5).toFixed(2)}">${s.nota}</div>` : '');
    case 'barre': {
      const max = Math.max(...s.righe.map(r => r[2]));
      return `<div class="el titolo-b" data-d="0">${s.titolo}</div>` + s.righe.map((r,i) => {
        const w = Math.max(r[2] / max * 100, 3);
        return `<div class="el riga-b" data-d="${(.4 + i*.55).toFixed(2)}">
          <div class="et">${r[0]}</div>
          <div class="pista"><i data-w="${w}"></i><b class="${w < 32 ? 'fuori' : ''}" style="${w < 32 ? 'left:calc('+w+'% + 20px)' : ''}">${r[1]}</b></div>
        </div>`;
      }).join('');
    }
    case 'numero':
      return (s.kicker ? `<div class="el kicker" data-d="0">${s.kicker}</div>` : '')
           + `<div class="el cifra ${s.rosso ? 'rossa' : ''}" data-d=".1" data-conta="${s.valore}" data-dec="${s.decimali||0}" data-pre="${s.prefisso||''}" data-suf="${s.suffisso||''}">0</div>`
           + `<div class="el etichetta" data-d=".5">${s.etichetta}</div>`;
    case 'lista':
      return (s.titolo ? `<div class="el titolo-b" data-d="0">${s.titolo}</div>` : '')
           + `<div class="lista">` + s.voci.map((v,i) =>
               `<div class="el voce" data-d="${(.4 + i*(s.passo||.9)).toFixed(2)}"><span class="n">${i+1}</span><div>${v[0]}${v[1] ? '<small>'+v[1]+'</small>' : ''}</div></div>`).join('')
           + `</div>`;
    case 'conto':
      return (s.titolo ? `<div class="el titolo-b" data-d="0">${s.titolo}</div>` : '')
           + `<div class="el card" data-d=".3">` + s.righe.map(r =>
               `<div class="r"><span>${r[0]}</span><b class="${r[2]||''}">${r[1]}</b></div>`).join('') + `</div>`
           + (s.nota ? `<div class="el nota" data-d="1.1">${s.nota}</div>` : '');
    case 'chiusura':
      return `<div class="el logo" data-d="0">${LOGO}Riskly</div>
        <div class="el claim" data-d=".35">${s.claim || 'Il rischio si gestisce <em>prima</em>,<br>non dopo.'}</div>
        <div class="el pill" data-d=".75">${s.cta || 'Calcolatori gratis · link in bio'}</div>
        <div class="el piccolo" data-d="1.1">${s.piccolo || 'Nessun segnale. Nessuna promessa di rendimento.<br>Contenuto educativo, non è consulenza finanziaria.'}</div>`;
  }
  return '';
}

window.prepara = function(spec){
  SPEC = spec; INIZI = []; TOTALE = 0;
  const box = document.getElementById('scene');
  box.innerHTML = spec.scene.map((s,i) =>
    `<div class="scena ${s.tipo === 'chiusura' ? 'chiusura' : ''}" id="sc${i}">${costruisci(s)}</div>`).join('');
  /* "subito": la prima scena è già tutta visibile dal primo fotogramma (YouTube Shorts: chi scorre decide in 1-2 s) */
  if(spec.subito) document.querySelectorAll('#sc0 .el').forEach(el => { el.dataset.d = '-2'; });
  spec.scene.forEach(s => { INIZI.push(TOTALE); TOTALE += s.dur; });
  return TOTALE;
};

window.disegna = function(t){
  document.getElementById('avanz').style.width = (clamp(t / TOTALE) * 100) + '%';
  SPEC.scene.forEach((s,i) => {
    const sc = document.getElementById('sc' + i);
    const lt = t - INIZI[i];
    const dentro = lt >= 0 && lt < s.dur;
    const ultima = i === SPEC.scene.length - 1;
    /* in un video "loop" l'ultima scena sfuma verso l'inizio, così il riavvio non si nota */
    const uscita = ultima ? (SPEC.loop ? clamp((s.dur - lt) / .25) : 1) : clamp((s.dur - lt) / .3);
    sc.style.opacity = dentro ? uscita : 0;
    if(!dentro) return;
    sc.querySelectorAll('.el').forEach(el => {
      const p = ease((lt - (+el.dataset.d)) / .55);
      el.style.opacity = p;
      el.style.transform = `translateY(${(1 - p) * 46}px)`;
      const barra = el.querySelector('i[data-w]');
      if(barra) barra.style.width = (ease((lt - (+el.dataset.d) - .1) / .9) * barra.dataset.w) + '%';
      if(el.dataset.conta !== undefined){
        const v = ease((lt - (+el.dataset.d)) / 1.6) * (+el.dataset.conta);
        el.textContent = el.dataset.pre + v.toFixed(+el.dataset.dec).replace('.', ',') + el.dataset.suf;
      }
    });
  });
};
</script>
</body>
</html>
