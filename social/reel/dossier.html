<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  /* Reel "dossier" 1080×1920 (riferimento mandato da Gabriele il 1° novembre: "cattura molto l'attenzione"):
     carta chiara a griglia, titoli neri enormi, rosso per i cali, ambra di riskly.trade per gli accenti,
     un oggetto animato diverso per ogni concetto (tabellone a palette, altalena, anello, domino, telefono, scontrino).
     Pagina opaca: niente video sotto. API come modello.html: window.mostra(scena, parole) e window.fotogramma(t, testo). */
  @font-face{font-family:'Archivo';src:url(../youtube/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
  @font-face{font-family:'Martian Mono';src:url(../youtube/martian-mono.woff2) format('woff2');font-weight:100 800;font-stretch:75% 112.5%}
  :root{--carta:#F2EEE4;--inchiostro:#141414;--rosso:#D62F3F;--ambra:#E9A81C;--grigio:#6E6A62;--riga:rgba(20,20,20,.07)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{font-family:'Archivo',sans-serif;color:var(--inchiostro);background:var(--carta);
       background-image:linear-gradient(var(--riga) 2px,transparent 2px),linear-gradient(90deg,var(--riga) 2px,transparent 2px);background-size:60px 60px}
  #testa{position:absolute;left:70px;right:70px;top:80px;display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:5px solid var(--inchiostro)}
  #testa b{font:italic 900 56px 'Archivo';font-stretch:90%}
  #testa span{background:var(--inchiostro);color:var(--carta);font:700 30px 'Martian Mono';padding:10px 22px;border-radius:8px;letter-spacing:.06em}
  #s{position:absolute;left:70px;right:70px;top:210px;height:1170px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .e{opacity:0}
  .riga-titolo{font-weight:900;font-stretch:72%;font-size:250px;line-height:.86;letter-spacing:-.02em}
  .rosso{color:var(--rosso)} .ambra{color:var(--ambra)}
  .flap{display:flex;gap:10px;justify-content:center}
  .flap i{font-style:normal;display:grid;place-items:center;width:118px;height:170px;background:var(--inchiostro);color:#fff;border-radius:12px;font:800 128px 'Martian Mono';position:relative;box-shadow:0 8px 0 rgba(0,0,0,.18)}
  .flap i::after{content:'';position:absolute;left:0;right:0;top:50%;height:4px;background:var(--carta);opacity:.8}
  .flap.piccolo i{width:72px;height:104px;font-size:70px;border-radius:9px}
  .flap i.sp{background:transparent;box-shadow:none;width:30px}
  .flap i.sp::after{display:none}
  .fascia{display:flex;width:100%;margin-top:40px;align-items:stretch}
  .fascia div{flex:1;background:var(--inchiostro);color:#fff;font:800 40px 'Archivo';font-stretch:85%;padding:22px 24px;text-align:left;letter-spacing:.03em}
  .fascia em{font-style:normal;background:var(--rosso);color:#fff;font:900 54px 'Archivo';padding:14px 26px;display:flex;align-items:center}
  .domanda{margin-top:56px;font:italic 900 112px 'Archivo';font-stretch:80%}
  .domanda u{text-decoration:none;color:var(--rosso);background:linear-gradient(transparent 72%,var(--ambra) 72%)}
  .etichetta{font:700 34px 'Martian Mono';letter-spacing:.12em;color:var(--grigio);text-transform:uppercase}
  .titolo{font-weight:900;font-stretch:75%;font-size:150px;line-height:.9;text-transform:uppercase}
  .dati{display:flex;gap:26px;width:100%;margin-top:40px}
  .dati div{flex:1;border:4px solid var(--inchiostro);background:#fff;padding:26px 28px;text-align:left}
  .dati small{font:700 26px 'Martian Mono';letter-spacing:.08em;color:var(--grigio);text-transform:uppercase}
  .dati b{display:block;font:900 84px 'Archivo';font-stretch:80%;margin-top:6px}
  .dati span{font:800 36px 'Martian Mono'}
  .stampo{position:absolute;font:900 96px 'Archivo';font-stretch:80%;color:var(--rosso);border:10px solid var(--rosso);padding:6px 28px;border-radius:14px;background:rgba(242,238,228,.9)}
  .motivi{display:flex;gap:16px;width:100%}
  .motivi div{flex:1;border:4px solid var(--inchiostro);padding:16px 10px;font:800 30px 'Archivo';font-stretch:85%;display:flex;align-items:center;gap:12px;justify-content:center;opacity:.35}
  .motivi div b{font:900 44px 'Martian Mono'}
  .motivi div.on{background:var(--rosso);border-color:var(--rosso);color:#fff;opacity:1}
  .grande-motivo{margin-top:34px;font-weight:900;font-stretch:72%;font-size:170px;line-height:.9;text-transform:uppercase}
  .coppia{display:flex;gap:40px;align-items:center;justify-content:center;width:100%;margin-top:46px}
  .anello{position:relative;width:360px;height:360px}
  .anello svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .anello .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .anello .c b{font:900 110px 'Archivo';font-stretch:80%;color:var(--rosso)}
  .anello .c span{font:700 24px 'Archivo';color:var(--grigio);max-width:220px;line-height:1.15}
  .barre{width:100%;margin-top:50px;text-align:left}
  .barra{display:flex;align-items:center;gap:24px;margin:18px 0}
  .barra span{width:330px;font:800 40px 'Archivo';font-stretch:85%}
  .barra .f{flex:1;height:64px;border:4px solid var(--inchiostro);background:#fff}
  .barra .f i{display:block;height:100%;width:0;background:var(--ambra)}
  .barra b{width:150px;text-align:right;font:900 54px 'Martian Mono'}
  .luogo{display:inline-flex;align-items:center;gap:16px;margin-top:34px;background:var(--inchiostro);color:#fff;font:800 38px 'Archivo';padding:16px 30px;letter-spacing:.05em}
  .luogo i{width:26px;height:26px;border-radius:50%;background:var(--rosso);box-shadow:0 0 0 8px rgba(214,47,63,.35)}
  .domino{position:relative;width:100%;height:400px;margin-top:60px}
  .tessera{position:absolute;bottom:20px;width:160px;height:300px;background:#fff;border:6px solid var(--inchiostro);display:grid;place-items:center;transform-origin:100% 100%}
  .tessera span{writing-mode:vertical-rl;transform:rotate(180deg);font:900 58px 'Archivo';font-stretch:80%;letter-spacing:.04em}
  .tessera.ultima{background:var(--rosso);border-color:var(--rosso);color:#fff}
  .pavimento{position:absolute;left:0;right:0;bottom:14px;height:6px;background:var(--inchiostro)}
  .scena-tel{position:relative;width:100%;height:720px;margin-top:30px}
  .tel{position:absolute;left:10px;top:0;width:400px;height:700px;border-radius:64px;background:var(--inchiostro);padding:22px}
  .tel .schermo{width:100%;height:100%;border-radius:46px;background:linear-gradient(180deg,#2a2a2a,#111);position:relative;overflow:hidden}
  .tel .ora{position:absolute;top:70px;width:100%;text-align:center;font:300 120px 'Archivo';color:#fff}
  .notifica{position:absolute;left:18px;right:18px;top:250px;background:#fff;border-radius:28px;padding:22px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .notifica small{font:700 20px 'Martian Mono';color:var(--grigio)}
  .notifica b{display:block;font:900 54px 'Archivo';font-stretch:80%;color:var(--rosso);margin:6px 0}
  .notifica p{font:600 24px/1.25 'Archivo'}
  .ricevuta{position:absolute;right:0;top:40px;width:470px;background:#fff;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.12);text-align:left}
  .ricevuta .dentro{padding:30px 30px 40px;font:600 30px 'Martian Mono'}
  .ricevuta h6{font:800 26px 'Martian Mono';text-align:center;margin-bottom:22px}
  .ricevuta .r{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:3px dashed #bbb}
  .ricevuta .r b{color:var(--rosso)}
  .ricevuta .tot{margin-top:22px;font:800 30px 'Martian Mono'}
  .tab{width:100%;margin-top:44px;display:flex;flex-direction:column;gap:22px}
  .tab .r{display:flex;align-items:center;gap:26px}
  .tab .r span{font:900 58px 'Archivo';font-stretch:80%;text-align:left}
  .cta{margin-top:56px;display:inline-flex;align-items:center;gap:22px;padding:28px 44px;background:var(--inchiostro);color:#fff;font:800 60px 'Archivo'}
  .cta em{font-style:normal;background:var(--ambra);color:var(--inchiostro);padding:6px 20px}
  .link{margin-top:24px;font:800 42px 'Martian Mono'}
  #sott{position:absolute;left:60px;right:60px;top:1420px;text-align:center;font:800 62px/1.2 'Archivo';font-stretch:88%;color:var(--inchiostro)}
  #sott mark{background:var(--ambra);color:var(--inchiostro);padding:0 8px}
  #piede{position:absolute;left:70px;right:70px;bottom:70px;display:flex;justify-content:space-between;align-items:center;border-top:4px solid var(--inchiostro);padding-top:22px}
  #piede div{display:flex;align-items:center;gap:14px;font:800 36px 'Archivo'}
  #piede svg{width:46px;height:46px}
  #piede small{font:500 22px 'Archivo';color:var(--grigio);max-width:560px;text-align:right;line-height:1.25}
</style></head>
<body>
<div id="testa"><b id="testata"></b><span id="data"></span></div>
<div id="s"></div><div id="sott"></div>
<div id="piede"><div><svg viewBox="0 0 44 44" fill="none"><rect width="44" height="44" rx="10" fill="#141414"/><path d="M9 31 L17 19.5 L23.5 25 L35 11" stroke="#E9A81C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 36 H35" stroke="#9A958B" stroke-width="3.6" stroke-linecap="round"/></svg>Riskly</div>
<small>Contenuto educativo, non è consulenza finanziaria. La leva comporta un alto rischio.</small></div>
<script>
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const back = x => { x = Math.min(1, Math.max(0, x)); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const SEGNI = '0123456789$%+−,.ABCDEFGHILMNOPRSTUVZ';
let S = null, P = [];
// un tempo può essere un numero (secondi dall'inizio della scena) o "w:parola" (quando la voce dice quella parola)
const T = v => { if(typeof v !== 'string') return v || 0; const w = v.slice(2).toLowerCase(); const x = P.find(p => p[1].toLowerCase().replace(/[^a-zàèéìòù0-9]/g, '').startsWith(w)); return x ? x[0] : 0; };
const flap = (txt, t0, cls = '') => `<div class="flap ${cls}" data-flap="${txt}" data-t="${t0}">${[...txt].map(c => `<i class="${c === ' ' ? 'sp' : ''}"></i>`).join('')}</div>`;
const motivi = s => `<div class="motivi e" data-in="0">${s.motivi.map((m, i) => `<div class="${i + 1 === s.n ? 'on' : ''}"><b>${i + 1}</b>${m}</div>`).join('')}</div>`;
const html = s => {
  if(s.tipo === 'copertina') return `<div class="riga-titolo e pop" data-in="0">${s.righe[0]}</div><div class="riga-titolo rosso e pop" data-in="0.35">${s.righe[1]}</div>
    <div style="margin-top:44px">${flap(s.flap, 0.6)}</div>
    <div class="fascia e" data-in="1.4"><div>${s.fascia}</div><em>${s.var} ▼</em></div>
    <div class="domanda e" data-in="${T('w:chi')}">${s.domanda}</div>`;
  if(s.tipo === 'altalena') return `<div class="etichetta e" data-in="0">${s.titolo}</div>
    <div class="dati">${s.dati.map((d, i) => `<div class="e" data-in="${0.3 + i * 0.4}"><small>${d[0]}</small><b>${d[1]}</b><span class="${i ? '' : 'rosso'}">${d[2]}</span></div>`).join('')}</div>
    <svg viewBox="0 0 940 620" width="940" height="620" style="margin-top:40px;overflow:visible">
      <polygon points="470,600 400,470 540,470" fill="#141414"/>
      <g id="trave" style="transform-origin:470px 460px">
        <rect x="60" y="448" width="820" height="24" fill="#141414"/>
        <g><rect x="80" y="300" width="260" height="148" fill="#fff" stroke="#141414" stroke-width="6"/><text x="210" y="365" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="34">${s.sx}</text><text x="210" y="420" text-anchor="middle" font-family="Martian Mono" font-weight="800" font-size="44" fill="#D62F3F">▼</text></g>
        <g id="oro"><rect x="600" y="300" width="260" height="148" fill="#E9A81C" stroke="#141414" stroke-width="6"/><text x="730" y="365" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="54">${s.dx}</text><text id="freccia" x="730" y="420" text-anchor="middle" font-family="Martian Mono" font-weight="800" font-size="44">▲</text></g>
      </g>
      <text id="disolito" x="730" y="190" text-anchor="middle" font-family="Martian Mono" font-weight="800" font-size="34" fill="#6E6A62" opacity="0">DI SOLITO: ▲</text>
    </svg>
    <div class="stampo e pop" data-in="${T(s.cade) + 0.25}" style="top:400px;transform:rotate(-6deg)">E INVECE: ORO ▼</div>`;
  if(s.tipo === 'motivo') return motivi(s) + `<div class="grande-motivo e pop" data-in="0.2">${s.n}. ${s.motivi[s.n - 1]}</div>
    <div class="coppia"><div><div class="etichetta e" data-in="0.6" style="margin-bottom:16px">${s.flap_label}</div>${flap(s.flap, 0.8)}</div>
    <div class="anello e" data-in="${T(s.anello_in)}"><svg viewBox="0 0 360 360"><circle cx="180" cy="180" r="150" stroke="rgba(20,20,20,.1)" stroke-width="36" fill="none"/>
      <circle cx="180" cy="180" r="150" stroke="#D62F3F" stroke-width="36" fill="none" stroke-dasharray="942" stroke-dashoffset="942" data-arco="${s.anello}" data-da="${T(s.anello_in) + 0.2}"/></svg>
      <div class="c"><b data-conta="${s.anello}" data-da="${T(s.anello_in) + 0.2}">0%</b><span>${s.anello_label}</span></div></div></div>
    <div class="barre"><div class="barra e" data-in="${T(s.barre_in) - 0.6}"><span>Bond USA 10 anni</span><div class="f"><i data-w="99" data-da="${T(s.barre_in) - 0.4}"></i></div><b>4,9%</b></div>
      <div class="barra e" data-in="${T(s.barre_in) - 0.3}"><span>Oro</span><div class="f"><i></i></div><b class="rosso">0%</b></div></div>`;
  if(s.tipo === 'domino') return motivi(s) + `<div class="grande-motivo e pop" data-in="0.2">${s.n}. ${s.motivi[s.n - 1]}</div>
    <div class="luogo e" data-in="0.9"><i></i>${s.luogo}</div>
    <div style="margin-top:34px"><div class="etichetta e" data-in="1.2" style="margin-bottom:14px">${s.flap_label}</div>${flap(s.flap, 1.4)}</div>
    <div class="domino">${s.tessere.map((x, i) => `<div class="tessera e${i === s.tessere.length - 1 ? ' ultima' : ''}" data-in="${T(s.domino_in) - 0.5 + i * 0.12}" data-cade="${T(s.domino_in) + 0.5 + i * 0.55}" style="left:${60 + i * 200}px"><span>${x}</span></div>`).join('')}<div class="pavimento"></div></div>`;
  if(s.tipo === 'telefono') return motivi(s) + `<div class="grande-motivo e pop" data-in="0.2" style="font-size:140px">${s.n}. ${s.motivi[s.n - 1]}</div>
    <div class="scena-tel"><div class="tel e" data-in="0.8"><div class="schermo"><div class="ora">15:42</div>
      <div class="notifica" data-scende="${T(s.notifica_in)}"><small>BROKER · ADESSO</small><b>⚠ MARGIN CALL</b><p>Margine insufficiente: deposita fondi o le posizioni verranno chiuse.</p></div></div></div>
      <div class="ricevuta" data-srotola="${T(s.ricevuta_in) - 0.3}"><div class="dentro"><h6>*** RICEVUTA ***<br>VEN 30 OTTOBRE</h6>
      ${s.ricevuta.map(r => `<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}<div class="tot">VENDO PER FARE CASSA</div></div></div></div>`;
  if(s.tipo === 'tabellone') return `<div class="titolo e pop" data-in="0">${s.titolo}</div><div class="etichetta e" data-in="0.6" style="margin-top:20px">${s.sotto}</div>
    <div class="tab">${s.date.map(d => `<div class="r">${flap(d[0], T(d[2]) - 0.2, 'piccolo')}<span class="e" data-in="${T(d[2]) + 0.3}">${d[1]}</span></div>`).join('')}</div>
    <div class="cta e pop" data-in="${T(s.cta_in)}">Commenta <em>${s.parola}</em></div><div class="link e" data-in="${T(s.cta_in) + 0.3}">${s.link}</div>`;
  return '';
};
window.mostra = (s, parole, testa) => {
  S = s; P = parole || [];
  document.getElementById('testata').textContent = testa[0]; document.getElementById('data').textContent = testa[1];
  document.getElementById('s').innerHTML = html(s);
  // la riga della tabella delle date: il testo deve stare a destra delle palette
};
// istanti dei clic (palette che girano, timbri) per la traccia degli effetti
window.suoni = () => {
  const out = [];
  document.querySelectorAll('[data-flap]').forEach(f => { const t0 = +f.dataset.t, n = f.dataset.flap.length; for(let t = t0; t < t0 + 0.45 + n * 0.09; t += 0.05) out.push([t, 'clic']); });
  document.querySelectorAll('.pop').forEach(e => out.push([+e.dataset.in, 'colpo']));
  document.querySelectorAll('[data-cade]').forEach(e => out.push([+e.dataset.cade + 0.35, 'colpo']));
  document.querySelectorAll('[data-scende]').forEach(e => out.push([+e.dataset.scende, 'notifica']));
  return out;
};
window.fotogramma = (t, testo) => {
  const s = document.getElementById('s');
  s.querySelectorAll('[data-in]').forEach(e => {
    const x = (t - +e.dataset.in) / 0.35;
    if(e.classList.contains('pop')){ const k = back(x); e.style.opacity = x > 0 ? 1 : 0; e.style.scale = x > 0 ? 1.35 - 0.35 * k : 1.35; }
    else { const k = ease(x); e.style.opacity = k; e.style.translate = `0 ${(1 - k) * 36}px`; }
  });
  s.querySelectorAll('[data-flap]').forEach(f => {
    const txt = [...f.dataset.flap], t0 = +f.dataset.t;
    f.querySelectorAll('i').forEach((el, i) => {
      if(txt[i] === ' ') return;
      const fine = t0 + 0.45 + i * 0.09;
      if(t < t0){ el.textContent = ''; el.style.opacity = 0; return; }
      el.style.opacity = 1;
      el.textContent = t >= fine ? txt[i] : SEGNI[(Math.floor(t * 25) * 7 + i * 13) % SEGNI.length];
    });
  });
  s.querySelectorAll('[data-w]').forEach(e => { e.style.width = (+e.dataset.w * ease((t - +e.dataset.da) / 0.9)) + '%'; });
  s.querySelectorAll('[data-conta]').forEach(e => { e.textContent = Math.round(+e.dataset.conta * ease((t - +e.dataset.da) / 1.1)) + '%'; });
  s.querySelectorAll('[data-arco]').forEach(e => { e.setAttribute('stroke-dashoffset', 942 * (1 - +e.dataset.arco / 100 * ease((t - +e.dataset.da) / 1.1))); });
  s.querySelectorAll('[data-cade]').forEach(e => { const k = ease((t - +e.dataset.cade) / 0.4); e.style.rotate = (k * 36) + 'deg'; });
  s.querySelectorAll('[data-scende]').forEach(e => { const k = back((t - +e.dataset.scende) / 0.4); e.style.translate = `0 ${(1 - k) * -330}px`; e.style.opacity = t > +e.dataset.scende ? 1 : 0; });
  s.querySelectorAll('[data-srotola]').forEach(e => { const k = ease((t - +e.dataset.srotola) / 1.4); e.style.height = (k * e.firstElementChild.offsetHeight) + 'px'; e.style.opacity = t > +e.dataset.srotola ? 1 : 0; });
  if(S && S.tipo === 'altalena'){
    const a = T(S.inclina), c = T(S.cade), tr = document.getElementById('trave'), oro = document.getElementById('oro');
    const k1 = ease((t - a + 0.6) / 0.6), k2 = ease((t - c) / 0.5);
    tr.style.transform = `rotate(${-12 * k1 * (1 - k2)}deg)`;
    oro.style.transform = `translate(0px, ${k2 * 330}px) rotate(${k2 * 18}deg)`;
    oro.style.transformBox = 'fill-box'; oro.style.transformOrigin = 'center';
    document.getElementById('freccia').textContent = t >= c ? '▼' : '▲';
    document.getElementById('freccia').setAttribute('fill', t >= c ? '#D62F3F' : '#141414');
    document.getElementById('disolito').setAttribute('opacity', k1 * (1 - k2));
  }
  document.getElementById('sott').innerHTML = testo || '';
};
</script></body></html>
