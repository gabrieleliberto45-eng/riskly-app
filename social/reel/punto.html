<body>
<div id="testa"><div class="marchio"><svg viewBox="0 0 44 44" fill="none"><rect width="44" height="44" rx="10" fill="#141414"/><path d="M9 31 L17 19.5 L23.5 25 L35 11" stroke="#E5A21A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 36 H35" stroke="#5E656D" stroke-width="3.6" stroke-linecap="round"/></svg>Riskly <em>IL PUNTO</em></div><div class="data" id="data"></div></div>
<div id="avanza"></div>
<div id="griglia"></div><div id="filigrana"></div><div id="s"></div><canvas id="scintille" width="1080" height="1920"></canvas><div id="sott"></div><div id="nastro"><span></span></div><div id="colpo"><div></div></div><div id="lampo"></div>
<div id="piede">Contenuto informativo ed educativo, non è consulenza finanziaria né una previsione. La leva comporta un alto rischio.</div>
<script>
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const back = x => { x = Math.min(1, Math.max(0, x)); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lin = x => Math.min(1, Math.max(0, x));
let S = null, P = [], INFO = [];
// "w:parola" = quando la voce la dice; "w:parola#2" = la seconda volta
const T = v => { if(typeof v !== 'string') return v || 0; const [w, n] = v.slice(2).toLowerCase().split('#'); const x = P.filter(p => p[1].toLowerCase().replace(/[^a-zàèéìòù0-9]/g, '').startsWith(w))[(+n || 1) - 1]; return x ? x[0] : 0; };
const euro = v => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const motivo = s => `<div class="motivo"><div class="num e pop" data-in="0">MOTIVO ${s.n} / 3</div><h2 class="e" data-in="0.25" data-parole="1">${s.nome}</h2></div>`;
const testa = s => s.n ? motivo(s) : `${s.etichetta ? `<div class="mono e" data-in="0">${s.etichetta}</div>` : ''}${s.titolo ? `<div class="h2 e" data-in="0.15" data-parole="1">${s.titolo}</div>` : ''}`;
const cta = s => s.cta ? `<div class="cta e pop" data-in="${T(s.cta[2])}">Commenta <em>${s.cta[0]}</em></div><div class="link e" data-in="${T(s.cta[2]) + 0.3}">${s.cta[1]}</div>` : '';
const minuti = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const nuove = s => {
  if(s.tipo === 'orologio') return testa(s) + `<div class="orologio"><div class="quadrante e pop" data-in="0.3"><svg viewBox="0 0 440 440">
      ${Array.from({ length: 12 }, (_, i) => `<line x1="220" y1="40" x2="220" y2="${i % 3 ? 62 : 78}" stroke="#141414" stroke-width="${i % 3 ? 5 : 10}" transform="rotate(${i * 30} 220 220)"/>`).join('')}
      <line class="lancia-h" x1="220" y1="220" x2="220" y2="110" stroke="#141414" stroke-width="20" stroke-linecap="round"/>
      <line class="lancia-m" x1="220" y1="230" x2="220" y2="70" stroke="var(--ambra)" stroke-width="12" stroke-linecap="round"/><circle cx="220" cy="220" r="18" fill="#141414"/></svg></div>
      <div class="tappe">${s.tappe.map(p => `<div class="tappa e" data-in="${T(p[2]) - 0.2}" data-tappa="${T(p[2])}"><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div></div>
      <div class="digitale" data-orologio='${JSON.stringify({ da: minuti(s.da || '12:00'), tappe: s.tappe.map(p => [T(p[2]), minuti(p[0])]) })}'></div>` + cta(s);
  if(s.tipo === 'quiz') return testa(s) + `<div class="domanda e" data-in="0.2">${s.domanda}</div><div class="timer e" data-in="0.3"><i data-timer="${T(s.opzioni[0][1])}" data-fine="${T(s.rivela)}"></i></div>
