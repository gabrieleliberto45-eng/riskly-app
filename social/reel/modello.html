<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  /* Reel verticali 1080×1920 nello stile chiesto da Gabriele il 27 ottobre (riferimento: reel @mich.fx sulla Fed):
     sfondo video vero (aggiunto da ffmpeg sotto questa pagina trasparente), schede blu scure con bordo luminoso,
     numeri grandi, una pillola con data e ora in alto, sottotitoli grandi in basso. */
  @font-face{font-family:'Archivo';src:url(../youtube/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
  @font-face{font-family:'Martian Mono';src:url(../youtube/martian-mono.woff2) format('woff2');font-weight:100 800;font-stretch:75% 112.5%}
  :root{--blu:#3D6BFF;--ciano:#6FE3FF;--bianco:#F4F7FF;--grigio:#AAB4D4;--scheda:rgba(10,18,48,.78);--bordo:rgba(92,140,255,.55);--rosso:#FF4D5E;--verde:#2BD98B;--ambra:#F2B83A}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;width:1080px;height:1920px;overflow:hidden}
  body{font-family:'Archivo',sans-serif;color:var(--bianco)}
  #s{position:absolute;inset:0;padding:150px 80px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
  .e{opacity:0;transform:translateY(40px)}
  .pill{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;background:rgba(61,107,255,.92);
        font:700 34px 'Archivo';letter-spacing:.04em;box-shadow:0 0 40px rgba(61,107,255,.6)}
  .pill i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
  .label{margin-top:70px;font:700 34px 'Martian Mono';letter-spacing:.14em;color:var(--ciano);text-transform:uppercase}
  .grande{margin-top:30px;font-weight:800;font-stretch:80%;font-size:150px;line-height:.98;letter-spacing:-.02em;text-shadow:0 6px 40px rgba(0,0,0,.6)}
  .medio{margin-top:26px;font-weight:800;font-stretch:82%;font-size:96px;line-height:1.02;text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .blu{color:var(--ciano)} .rosso{color:var(--rosso)} .verde{color:var(--verde)}
  .num{font-weight:800;font-stretch:85%;font-size:190px;line-height:1;background:linear-gradient(180deg,#fff,#9FC2FF);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(92,140,255,.55))}
  .scheda{margin-top:44px;width:100%;background:var(--scheda);border:2px solid var(--bordo);border-radius:36px;padding:40px 46px;
          box-shadow:0 0 50px rgba(61,107,255,.28), inset 0 0 30px rgba(61,107,255,.12);backdrop-filter:blur(6px);text-align:left}
  .scheda h4{font:700 30px 'Martian Mono';letter-spacing:.1em;color:var(--grigio);text-transform:uppercase;margin-bottom:26px}
  .barra{margin:22px 0}
  .barra .t{display:flex;justify-content:space-between;font:700 46px 'Archivo';margin-bottom:14px}
  .barra .t b{font-family:'Martian Mono';font-size:44px}
  .barra .f{height:26px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .barra .f i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blu),var(--ciano));box-shadow:0 0 24px var(--blu)}
  .barra.debole .f i{background:linear-gradient(90deg,#5b6688,#8d97b8);box-shadow:none}
  .riga{display:flex;justify-content:space-between;align-items:baseline;gap:30px;padding:22px 0;border-bottom:2px solid rgba(255,255,255,.1);font:600 42px 'Archivo'}
  .riga:last-child{border-bottom:none}
  .riga b{font:800 64px 'Archivo';font-stretch:85%;color:var(--ciano);white-space:nowrap}
  .metro{margin-top:40px;position:relative;width:520px;height:520px}
  .metro svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .metro .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .metro .c b{font:800 150px 'Archivo';font-stretch:85%}
  .metro .c span{font:600 34px 'Archivo';color:var(--grigio);margin-top:6px;max-width:340px;line-height:1.2}
  .due{display:flex;flex-direction:column;gap:30px;width:100%;margin-top:44px}
  .scen{background:var(--scheda);border:2px solid var(--bordo);border-radius:32px;padding:34px 40px;text-align:left;box-shadow:0 0 40px rgba(61,107,255,.25)}
  .scen small{font:700 28px 'Martian Mono';letter-spacing:.1em;color:var(--ciano)}
  .scen h5{font:800 56px 'Archivo';font-stretch:85%;margin:12px 0 10px;line-height:1.05}
  .scen p{font:500 40px/1.3 'Archivo';color:var(--grigio)}
  .scen p b{color:#fff}
  .check{display:flex;align-items:center;gap:28px;padding:22px 0;font:700 50px 'Archivo';text-align:left}
  .check i{flex:none;width:66px;height:66px;border-radius:20px;background:var(--blu);display:grid;place-items:center;font:900 40px 'Archivo';font-style:normal;box-shadow:0 0 24px var(--blu)}
  .cta{margin-top:50px;display:inline-flex;align-items:center;gap:22px;padding:30px 44px;border-radius:40px;background:#fff;color:#0A1230;font:800 54px 'Archivo';box-shadow:0 0 60px rgba(111,227,255,.5)}
  .cta em{font-style:normal;background:var(--blu);color:#fff;padding:6px 18px;border-radius:16px}
  .link{margin-top:26px;font:700 38px 'Martian Mono';color:var(--ciano)}
  canvas.mini{margin-top:36px;width:920px;height:520px}
  #sott{position:absolute;left:60px;right:60px;bottom:250px;text-align:center;font:800 64px/1.15 'Archivo';font-stretch:88%;color:#fff;
        text-shadow:0 0 6px #000,0 4px 18px rgba(0,0,0,.9);-webkit-text-stroke:2px rgba(0,0,0,.55)}
  #sott mark{background:none;color:#FFE16B}
  #piede{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;align-items:center;gap:14px;font:700 32px 'Archivo';color:rgba(255,255,255,.85)}
  #piede svg{width:40px;height:40px}
  #avviso{position:absolute;left:60px;right:60px;bottom:60px;text-align:center;font:500 24px 'Archivo';color:rgba(255,255,255,.6)}
</style></head>
<body><div id="s"></div><div id="sott"></div>
<div id="piede"><svg viewBox="0 0 44 44" fill="none"><rect width="44" height="44" rx="10" fill="#FBFBF9"/><path d="M9 31 L17 19.5 L23.5 25 L35 11" stroke="#B97C00" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 36 H35" stroke="#5E656D" stroke-width="3.6" stroke-linecap="round"/></svg>Riskly</div>
<div id="avviso">Contenuto educativo, non è consulenza finanziaria. La leva comporta un alto rischio.</div>
<script>
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
let scena = null, corrente = -1;
const html = s => {
  const p = s.pill ? `<div class="pill e" data-in="0"><i></i>${s.pill}</div>` : '';
  if(s.tipo === 'gancio') return p + `<div class="grande e" data-in="0.15">${s.grande}</div><canvas class="mini e" data-in="0.3" width="920" height="520" data-crollo="1"></canvas>${s.sotto ? `<div class="medio e" data-in="1.2" style="font-size:70px">${s.sotto}</div>` : ''}`;
  if(s.tipo === 'barre') return p + `<div class="label e" data-in="0.1">${s.label}</div><div class="scheda e" data-in="0.3"><h4>${s.titolo}</h4>${s.barre.map((b, i) =>
      `<div class="barra${i ? ' debole' : ''}"><div class="t"><span>${b[0]}</span><b data-conta="${b[1]}" data-da="${0.5 + i * 0.3}">~0%</b></div><div class="f"><i data-w="${b[1]}" data-da="${0.5 + i * 0.3}"></i></div></div>`).join('')}</div>` +
      (s.righe ? `<div class="scheda e" data-in="${s.dopo || 2}">${s.righe.map(r => `<div class="riga"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>` : '');
  if(s.tipo === 'metro') return `<div class="label e" data-in="0">${s.label}</div><div class="medio e" data-in="0.2">${s.grande}</div>
      <div class="metro e" data-in="${s.dopo || 1.2}"><svg viewBox="0 0 520 520"><circle cx="260" cy="260" r="220" stroke="rgba(255,255,255,.12)" stroke-width="34" fill="none"/>
      <circle cx="260" cy="260" r="220" stroke="url(#gr)" stroke-width="34" fill="none" stroke-linecap="round" stroke-dasharray="1382" stroke-dashoffset="1382" data-arco="${s.valore}" data-da="${(s.dopo || 1.2) + 0.2}"/>
      <defs><linearGradient id="gr"><stop offset="0" stop-color="#3D6BFF"/><stop offset="1" stop-color="#6FE3FF"/></linearGradient></defs></svg>
      <div class="c"><b data-conta="${s.valore}" data-da="${(s.dopo || 1.2) + 0.2}">~0%</b><span>${s.etichetta}</span></div></div>`;
  if(s.tipo === 'quadro') return `<div class="label e" data-in="0">${s.label}</div><div class="scheda e" data-in="0.2">${s.righe.map((r, i) =>
      `<div class="riga e" data-in="${0.4 + i * (s.passo || 1.6)}"><span>${r[0]}</span><b${r[2] ? ` class="${r[2]}"` : ''}>${r[1]}</b></div>`).join('')}</div>`;
  if(s.tipo === 'scenari') return `<div class="label e" data-in="0">${s.label}</div><div class="medio e" data-in="0.15">${s.grande}</div><div class="due">${s.scenari.map((x, i) =>
      `<div class="scen e" data-in="${x[3]}"><small>SCENARIO ${i + 1}</small><h5>${x[0]}</h5><p>${x[1]} · <b>${x[2]}</b></p></div>`).join('')}</div>`;
  if(s.tipo === 'piano') return `<div class="label e" data-in="0">${s.label}</div><div class="scheda e" data-in="0.2">${s.punti.map((x, i) =>
      `<div class="check e" data-in="${x[1]}"><i>✓</i>${x[0]}</div>`).join('')}</div><div class="cta e" data-in="${s.cta_in}">Commenta <em>${s.parola}</em></div><div class="link e" data-in="${s.cta_in + 0.3}">${s.link}</div>`;
  return '';
};
/* candela che crolla: un piccolo grafico che sale e poi cade */
function crollo(cv, k){
  const x = cv.getContext('2d'), W = cv.width, H = cv.height; x.clearRect(0, 0, W, H);
  const N = 18, sw = W / (N + 1); let p = 60;
  const val = []; for(let i = 0; i < N; i++){ const o = p; p += (i < N - 1 ? (Math.sin(i * 1.7) * 18 + 9) : -260); val.push([o, p]); }
  const mn = Math.min(...val.flat()) - 30, mx = Math.max(...val.flat()) + 30, y = v => H - (v - mn) / (mx - mn) * H;
  const quante = Math.floor(ease(k) * N + 0.0001);
  for(let i = 0; i < Math.min(N, quante + 1); i++){
    const [o, c] = val[i], su = c >= o, cx = sw * (i + 1);
    let cc = c; if(i === quante && i < N) cc = o + (c - o) * ((ease(k) * N) % 1);
    x.strokeStyle = x.fillStyle = su ? '#2BD98B' : '#FF4D5E'; x.shadowColor = x.fillStyle; x.shadowBlur = i === N - 1 ? 30 : 8;
    x.fillRect(cx - sw * .32, y(Math.max(o, cc)), sw * .64, Math.max(4, Math.abs(y(o) - y(cc))));
  }
}
window.mostra = s => { scena = s; document.getElementById('s').innerHTML = html(s); };
window.fotogramma = (t, testo) => {
  const s = document.getElementById('s');
  s.querySelectorAll('[data-in]').forEach(e => { const k = ease((t - +e.dataset.in) / 0.45); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 40}px)`; });
  s.querySelectorAll('[data-w]').forEach(e => { e.style.width = (+e.dataset.w * ease((t - +e.dataset.da) / 1.1)) + '%'; });
  s.querySelectorAll('[data-conta]').forEach(e => { e.textContent = '~' + Math.round(+e.dataset.conta * ease((t - +e.dataset.da) / 1.1)) + '%'; });
  s.querySelectorAll('[data-arco]').forEach(e => { e.setAttribute('stroke-dashoffset', 1382 * (1 - +e.dataset.arco / 100 * ease((t - +e.dataset.da) / 1.3))); });
  s.querySelectorAll('canvas[data-crollo]').forEach(c => crollo(c, (t - 0.3) / 2.2));
  document.getElementById('sott').innerHTML = testo || '';
};
</script></body></html>
