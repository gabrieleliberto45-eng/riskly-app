<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  /* "Storie di rischio": verticale 1080×1920, documentario. 3D a pieno schermo, grana, vignetta, sottotitoli parola per parola */
  @font-face{font-family:'Archivo';src:url(archivo.woff2) format('woff2');font-weight:400 900;font-stretch:62% 125%}
  @font-face{font-family:'Martian Mono';src:url(martian-mono.woff2) format('woff2');font-weight:400 700;font-stretch:75% 112.5%}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000}
  #v{width:1080px;height:1920px;position:relative;overflow:hidden;background:#050605;font-family:'Archivo',sans-serif;color:#F3F1EA}
  #gl{position:absolute;inset:0;width:1080px;height:1920px}
  .velo{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 45%,transparent 45%,rgba(0,0,0,.75) 100%),
               linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 22%,transparent 55%,rgba(0,0,0,.85) 100%)}
  #grana{position:absolute;inset:0;width:1080px;height:1920px;opacity:.09;mix-blend-mode:screen}
  .barra{position:absolute;left:0;right:0;height:120px;background:#000}
  .su{top:0}.giu{bottom:0}
  .serie{position:absolute;top:170px;left:0;right:0;text-align:center;font:600 30px 'Martian Mono';letter-spacing:.3em;color:#B6D84F}
  #cart{position:absolute;top:250px;left:70px;right:70px;text-align:center;font:800 54px/1.15 'Archivo';font-stretch:80%;letter-spacing:.04em;text-transform:uppercase}
  #cart span{background:rgba(0,0,0,.6);padding:8px 18px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  #sub{position:absolute;left:70px;right:70px;top:1260px;text-align:center;font-weight:900;font-stretch:80%;font-size:92px;line-height:1.05;
       text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.9),0 0 2px #000}
  #sub b{color:#B6D84F}
  .handle{position:absolute;bottom:150px;left:0;right:0;text-align:center;font:600 30px 'Martian Mono';color:rgba(243,241,234,.7)}
  #disc{position:absolute;bottom:200px;left:90px;right:90px;text-align:center;font:500 26px/1.4 'Archivo';color:rgba(243,241,234,.65)}
</style></head>
<body><div id="v">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <canvas id="grana" width="540" height="960"></canvas>
  <div class="velo"></div>
  <div class="barra su"></div><div class="barra giu"></div>
  <div class="serie">STORIE DI RISCHIO</div>
  <div id="cart"></div>
  <div id="sub"></div>
  <div id="disc"></div>
  <div class="handle">riskly.trade</div>
</div>
<script>
window.visZoom=1.35;
const g=document.getElementById('grana').getContext('2d'), img=g.createImageData(540,960);
function grana(seed){let x=seed*9301+49297;for(let i=0;i<img.data.length;i+=4){x=(x*9301+49297)%233280;const v=x/233280*255;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;}g.putImageData(img,0,0);}
let parole=[], cartello='';
window.prepara=(seg,ultimo,par)=>{ parole=par; cartello=seg.cartello||''; if(window.vis) window.vis.imposta(seg.visual);
  document.getElementById('disc').textContent=ultimo?'Contenuto informativo ed educativo, non è consulenza finanziaria. Il trading con leva comporta un alto rischio.':''; };
window.fotogramma=(t,f)=>{
  // cartello: si scrive lettera per lettera nei primi secondi
  const n=Math.floor(Math.max(0,t-.2)*28); document.getElementById('cart').innerHTML=cartello?`<span>${cartello.slice(0,n)}</span>`:'';
  // sottotitoli: gruppi di 4 parole, la parola detta adesso in verde
  let k=parole.findIndex(p=>t<p[1]); if(k<0) k=parole.length-1; if(t<(parole[0]||[0])[0]) k=0;
  const ini=Math.floor(k/4)*4, gr=parole.slice(ini,ini+4);
  document.getElementById('sub').innerHTML=parole.length&&t>=parole[0][0]-.1?gr.map((p,j)=>ini+j===k?`<b>${p[2]}</b>`:p[2]).join(' '):'';
  if(f%2===0) grana(f);
  if(window.vis) window.vis.disegna(t);
};
</script>
<script type="module" src="vis3d.js"></script>
</body></html>
