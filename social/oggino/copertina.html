<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  /* Copertina dei video "come funziona": nome del bot grande al centro (resta dentro il ritaglio 3:4 della griglia di Instagram). window.copertina(c) */
  @font-face{font-family:'Archivo';src:url(archivo.woff2) format('woff2');font-weight:400 900;font-stretch:62% 125%}
  @font-face{font-family:'Martian Mono';src:url(martian-mono.woff2) format('woff2');font-weight:400 700;font-stretch:75% 112.5%}
  *{margin:0;padding:0;box-sizing:border-box}
  #c{width:1080px;height:1920px;position:relative;overflow:hidden;background:#050605;color:#F3F1EA;font-family:'Archivo'}
  #cand{position:absolute;left:0;top:0;opacity:.3}
  .logo{position:absolute;top:300px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:18px;font:800 54px 'Archivo'}
  .logo svg{width:66px;height:66px}
  .centro{position:absolute;left:60px;right:60px;top:560px;height:800px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .tag{font:700 40px 'Martian Mono';letter-spacing:.18em;color:#B6D84F;border:3px solid rgba(182,216,79,.55);border-radius:999px;padding:14px 34px;margin-bottom:54px}
  #nome{font:900 210px/0.95 'Archivo';font-stretch:68%;letter-spacing:-.01em;text-shadow:0 0 80px rgba(0,0,0,.9)}
  #frase{font:600 54px/1.25 'Archivo';margin-top:56px;color:#F3F1EA;max-width:900px;text-wrap:balance}
  .piede{position:absolute;bottom:420px;left:0;right:0;text-align:center;font:600 36px 'Martian Mono';color:#9aa0a6}
</style></head>
<body><div id="c">
  <canvas id="cand" width="1080" height="1920"></canvas>
  <div class="logo"><svg viewBox="0 0 44 44"><rect width="44" height="44" rx="10" fill="#FBFBF9"/><path d="M9 31 L17 19.5 L23.5 25 L35 11" stroke="#B97C00" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 36 H35" stroke="#5E656D" stroke-width="3.2" stroke-linecap="round"/></svg>Riskly</div>
  <div class="centro"><div class="tag">COME FUNZIONA</div><div id="nome"></div><div id="frase"></div></div>
  <div class="piede">MT4 · MT5</div>
</div>
<script>
window.copertina = c => {
  const n = document.getElementById('nome'); n.textContent = c.nome; let fs = 210; n.style.fontSize = fs + 'px'; while(n.scrollWidth > 860 && fs > 100){ fs -= 4; n.style.fontSize = fs + 'px'; } document.getElementById('frase').textContent = c.frase;
  const g = document.getElementById('cand').getContext('2d'); g.clearRect(0, 0, 1080, 1920);
  let x = c.seme, p = 1100;
  for(let i = 0; i < 30; i++){ x = (x * 9301 + 49297) % 233280; const d = (x / 233280 - .5) * 110 + (p - 1080) * .25 - 9; const o = p, cl = p - d; x = (x * 9301 + 49297) % 233280; const w = 20 + x / 233280 * 50;
    const col = cl < o ? '#00C853' : '#FF1744'; g.fillStyle = g.strokeStyle = col; g.lineWidth = 3; const cx = 20 + i * 36;
    g.beginPath(); g.moveTo(cx + 12, Math.min(o, cl) - w); g.lineTo(cx + 12, Math.max(o, cl) + w); g.stroke(); g.fillRect(cx, Math.min(o, cl), 24, Math.max(4, Math.abs(o - cl))); p = cl; }
};
window.pronto = true;
</script></body></html>
